<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YOUR NAME 영상 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1030; --navy-2:#1B2247; --blue:#1F4FD8; --blue-d:#173DAA; --blue-pale:#EEF2FD;
  --ground:#F3F2ED; --surface:#ffffff; --border:#E2E1DA; --rule:#EEEDE7; --control:#C9C8C1;
  --text:#0B1030; --muted:#5A5F70;
  --font:"IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{word-break:keep-all;font-family:var(--font);color:var(--text);background:var(--ground);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ================= 보기 화면 =================
   PC 보기: 화면 가득 (화면이 좁은 휴대폰에서는 1200px 폭 PC 화면을 통째로 줄여서 보여줘요)
   모바일 보기: 휴대폰 폭(430px) 그대로, 틀 없이 */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--ground)}
#app{margin:0 auto;background:#fff}
body[data-mode="mob"] #app{width:min(430px,100%)}
body[data-mode="pc"] #app{margin:0;width:calc(100%/var(--s,1));height:calc(100%/var(--s,1));transform:scale(var(--s,1));transform-origin:0 0}
/* 휴대폰에서 PC 보기일 때: 화면 아래에 원래 크기로 뜨는 돌아가기 버튼 */
#backMob{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;white-space:nowrap;box-shadow:0 6px 20px rgba(11,16,48,.3)}
#backMob svg{width:18px;height:18px}
body[data-mode="pc"][data-small] #backMob{display:inline-flex}

/* ================= 앱: 좁으면 키오스크 배치, 넓으면 테이블 태블릿 배치 ================= */
.app{container:app/inline-size;height:100%}
.shell{--prim:var(--navy);--prim-h:var(--navy-2);position:relative;height:100%;display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:88px minmax(0,1fr) auto;grid-template-areas:"bar bar" "nav main" "dock dock";background:#fff;color:var(--text);font-size:14px;line-height:20px}

/* --- 키오스크(모바일): 위 배너 · 왼쪽 분류 줄 · 오른쪽 메뉴 · 아래 버튼 --- */
.bar{grid-area:bar;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:32px;height:32px}
.brand b{display:block;font-size:20px;line-height:26px;font-weight:700}
.brand span span{display:block;font-size:13px;line-height:18px;color:#C9CDE0}
.sp{flex:1}
/* 보기 바꾸기 버튼: PC 보기 ↔ 모바일 보기 */
.view{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.5);color:#fff;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s}
.view:hover{background:rgba(255,255,255,.14)}
.view:active{transform:scale(.97)}
.view svg{width:18px;height:18px}
.view span{display:inline-flex;align-items:center;gap:6px}
body[data-mode="pc"] .view .to-pc,body[data-mode="mob"] .view .to-mob{display:none}
.only-wide{display:none!important}
.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn.prim{background:var(--prim);color:#fff}
.btn.prim:hover{background:var(--prim-h)}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--control)}
.btn.ghost:hover{background:var(--ground)}

.nav{grid-area:nav;display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding:8px;background:var(--ground);border-right:1px solid var(--border);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;padding:8px 2px;border-radius:12px;font-size:13px;line-height:16px;font-weight:500;color:var(--muted);text-align:center;border:2px solid transparent;transition:background .15s,color .15s}
.nav button svg{width:26px;height:26px}
.nav button:hover{background:#E9E8E1;color:var(--text)}
.nav button[aria-current="true"]{background:#fff;color:var(--text);font-weight:700;border-color:var(--navy)}
.main{grid-area:main;min-height:0;overflow:auto;padding:16px}
.dock{grid-area:dock;display:grid;grid-template-columns:1fr 1.7fr;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid var(--border)}
.dock .btn{height:52px;font-size:16px}
.dock .btn svg{width:20px;height:20px}

.trow{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.title{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.cnt{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer}
.card.off{cursor:default}
.thumb{position:relative;display:flex;align-items:flex-end;width:100%;aspect-ratio:16/9;overflow:hidden;padding:8px 10px;text-align:left;color:#C9CDE0;font-weight:500;font-size:13px;line-height:18px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .pl{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;transition:transform .15s}
.thumb .pl svg{width:14px;height:14px;margin-left:2px}
.card:hover .pl,a.thumb:hover .pl{transform:scale(1.12)}
.thumb[disabled]{cursor:default}
.bdg{position:absolute;left:0;top:0;padding:3px 8px;background:#fff;color:var(--navy);font-size:12px;line-height:16px;font-weight:600}
.info{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.card h3{min-width:0;font-size:15px;line-height:22px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;line-height:18px;color:var(--muted)}
.more{justify-self:start;margin-top:2px;height:26px;padding:0 10px;border-radius:999px;background:var(--blue);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s}
.more:hover{background:var(--blue-d)}
.more[disabled]{background:var(--rule);color:var(--muted);cursor:default}
/* 세로 영상(9:16) 카드: 두 줄 높이를 차지해서 옆의 가로 영상 두 개와 키가 맞아요 */
.card.tall{grid-row:span 2}
.card.tall .thumb{flex:1 1 auto;aspect-ratio:9/16}

/* 분류마다 맨 위에 들어가는 가로 꽉 찬 영상 배너 */
.banner{position:relative;margin:-16px -16px 16px;aspect-ratio:16/9;background:var(--navy);color:#C9CDE0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:14px}
.banner iframe{position:absolute;left:0;top:50%;width:100%;aspect-ratio:16/9;transform:translateY(-50%);border:0;pointer-events:none}
.banner .bp{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center}
.banner .bp svg{width:18px;height:18px;margin-left:3px}
.bigphoto{margin:-16px -16px 20px;aspect-ratio:4/5;background:var(--ground);color:var(--muted);display:grid;place-items:center;font-weight:500;overflow:hidden}
.bigphoto img{width:100%;height:100%;object-fit:cover}

/* 소개 */
.profile .role{color:var(--muted);margin-top:4px}
.profile p.intro{font-size:15px;line-height:24px;margin-top:12px;max-width:60ch}
.profile h2{font-size:16px;line-height:24px;font-weight:600;margin-top:24px}
.hist{width:100%;border-collapse:collapse;margin-top:8px}
.hist td{padding:10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.hist td:first-child{width:88px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tools span{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--border);display:inline-flex;align-items:center;font-size:13px}
.yt{display:flex;align-items:center;gap:12px;margin-top:8px;padding:14px 16px;border:1px solid var(--border);transition:background .15s,border-color .15s}
.yt:hover{background:var(--ground);border-color:var(--control)}
.yt svg{flex:none;width:28px;height:28px}
.yt b{display:block;font-weight:600;font-size:15px}
.yt span{font-size:13px;color:var(--muted)}

/* 영상 상세 (메뉴를 눌렀을 때 뜨는 창) */
.modal{grid-row:2;grid-column:1/-1;z-index:2;background:#fff;overflow:auto;padding:16px}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.player{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--navy)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .thumb{height:100%;aspect-ratio:auto;font-size:16px;line-height:22px;padding:16px 20px}
.player .thumb .pl{width:64px;height:64px;margin:-32px 0 0 -32px}
.player .thumb .pl svg{width:24px;height:24px;margin-left:4px}
.player.tall{aspect-ratio:9/16;width:62%;margin:0 auto}   /* 세로 영상은 세로 화면으로 재생 */
.ytnote{margin-top:8px;font-size:13px;line-height:18px;color:var(--muted)}
.dr{margin-top:16px}
.dr h2{font-size:22px;line-height:28px;font-weight:600}
.dr .meta{font-size:13px;line-height:20px;margin-top:4px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);margin-top:16px}
.tabs button{height:40px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--blue)}
.pane{padding-top:16px;font-size:15px;line-height:24px;min-height:120px}
.steps{padding-left:20px}
.steps li{margin-bottom:12px}
.steps b{display:block;font-weight:600}
.ask{margin-top:16px;height:48px;width:100%;font-size:15px}

/* --- 테이블 태블릿(PC): 위 줄 · 왼쪽 글자 메뉴 · 3열 사진 · 오른쪽 아래 버튼
       가로 합계: 200(메뉴) + 본문 = 화면 폭, 본문 3열 = 3칸 + 간격 20 x 2 --- */
@container app (min-width:900px){
  .shell{--prim:var(--blue);--prim-h:var(--blue-d);grid-template-columns:200px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr) 72px;grid-template-areas:"bar bar" "nav main" "nav dock"}
  .only-wide{display:flex!important}
  .only-narrow{display:none!important}
  .bar{background:#fff;color:var(--text);border-bottom:1px solid var(--border);padding:0 24px;gap:0}
  .brand{width:176px;gap:8px;color:var(--blue)}
  .brand svg{width:26px;height:26px}
  .brand b{font-size:18px;line-height:24px;color:var(--text)}
  .brand span span{display:none}
  .here{flex-direction:column}
  .here .hname{font-size:16px;line-height:22px;font-weight:600}
  .here span{font-size:13px;line-height:18px;color:var(--muted)}
  .view{margin-right:12px;border-color:var(--control);border-radius:8px;color:var(--text)}
  .view:hover{background:var(--ground)}
  .tbl{flex-direction:column;align-items:center;min-width:72px;padding:4px 14px;border:1px solid var(--border);border-radius:8px}
  .tbl span{font-size:12px;line-height:16px;color:var(--muted)}
  .tbl b{font-size:18px;line-height:22px;font-weight:700}
  .nav{gap:2px;padding:16px 12px;background:#fff}
  .nav button{flex-direction:row;justify-content:flex-start;min-height:0;height:52px;padding:0 16px;border:0;border-radius:8px;font-size:17px;line-height:24px;font-weight:600;color:var(--text);text-align:left}
  .nav button svg{display:none}
  .nav button:hover{background:var(--ground)}
  .nav button[aria-current="true"]{background:var(--blue-pale);color:var(--blue)}
  .nav .line{flex:none;height:1px;margin:10px 16px;background:var(--border)}
  .main{padding:24px}
  .trow{display:none}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
  .thumb .pl{width:44px;height:44px;margin:-22px 0 0 -22px}
  .card.tall .thumb{aspect-ratio:3/4}          /* 넓은 화면: 가로 카드 두 줄 높이에 맞추고 */
  .card.tall .thumb img{object-fit:contain}   /* 세로 썸네일은 자르지 않고 통째로 */
  .player.tall{width:280px}
  .card h3{font-size:16px;line-height:24px;font-weight:500}
  .meta{font-size:15px;line-height:22px;font-weight:600;color:var(--blue)}
  .more{display:none}
  .banner{margin:-24px -24px 24px;aspect-ratio:auto;height:260px;font-size:15px}
  .bigphoto{margin:-24px -24px 24px;aspect-ratio:auto;height:400px}
  .profile{max-width:760px}
  .profile .title{display:block;font-size:22px}
  .dock{display:flex;justify-content:flex-end;align-items:center;gap:20px;padding:0 24px}
  .dock .seen{align-items:baseline;gap:6px;font-size:15px;color:var(--muted)}
  .dock .seen b{font-size:20px;font-weight:700;color:var(--text)}
  .dock .btn{height:48px;width:260px;border-radius:8px;font-size:17px}
  .modal{grid-row:1/-1;z-index:5;display:grid;place-items:center;padding:32px;background:rgba(11,16,48,.55)}
  .dlg{width:min(1040px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:12px;padding:20px 24px 24px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:0 24px;align-content:start}
  .dtop{grid-column:1/-1}
  .dr{margin-top:0;display:flex;flex-direction:column}
  .pane{flex:1}
  .ask{border-radius:8px}
}

/* 문의 창 */
dialog{margin:auto;border:0;border-radius:16px;padding:24px;width:min(360px,calc(100vw - 32px));color:var(--text);box-shadow:0 12px 40px rgba(11,16,48,.25)}
dialog::backdrop{background:rgba(11,16,48,.5)}
dialog h2{font-size:20px;line-height:28px;font-weight:600}
dialog .about{color:var(--muted);margin-top:4px}
.way{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);transition:background .15s,border-color .15s}
.way:hover{background:var(--ground);border-color:var(--control)}
.way.first{margin-top:20px;background:var(--navy);border-color:var(--navy);color:#fff}
.way.first:hover{background:var(--navy-2);border-color:var(--navy-2)}
.way svg{flex:none;width:24px;height:24px}
.way b{display:block;font-weight:600;font-size:15px}
.way span{font-size:13px}
dialog .btn{width:100%;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-mode="pc">

<!-- 보기 화면: PC로 들어오면 PC 화면, 휴대폰으로 들어오면 키오스크 화면이 바로 떠요 -->
<div id="stage"><div class="app" id="app"></div></div>
<button id="backMob" onclick="setMode('mob')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>모바일 보기로 돌아가기</button>

<!-- 연락 문의 창 -->
<dialog id="dlg" aria-labelledby="dlgT">

  <button class="btn ghost" onclick="dlg.close()">닫기</button>
</dialog>

  tools:['After Effects','Premiere Pro','Photoshop','Illustrator','Figma']

// 3) 분류 — banner: 그 분류 맨 위 배너에 틀 영상의 유튜브 ID (전체의 banner가 소개 영상이에요)
const CATS=[
  {id:'all',   name:'전체',        icon:'grid', banner:''},

  {id:'book',  name:'북트레일러',   icon:'book', banner:''},
  {id:'ani',   name:'애니메이션',   icon:'film', banner:''},
  {id:'team',  name:'팀 프로젝트',  icon:'team', banner:''},

];

// 4) 작품 — yt: 유튜브 영상 ID (youtube.com/watch?v=이부분). 넣으면 썸네일과 재생이 연결돼요
//    state: 'wip' 제작 중 / 'soon' 준비 중
const T=['#0B1030','#232B45','#141A2E','#2D3552','#1B2440','#101526'];   // 썸네일 없을 때 쓰는 임시 색
const WORKS=[
  ...[1,2,3,4,5,6].map(n=>({id:'ad'+n,cats:['ad'],title:'광고 '+n,en:'AD '+n,time:'0:15',year:2025,tools:'After Effects',yt:''})),
  // 북트레일러 — ratio:'9:16' 을 넣으면 세로 영상 카드(두 줄 높이)로 들어가요. by: 책 지은이
  {id:'bk1',cats:['book'],title:'바람이 분다, 가라',by:'한강',en:'BOOK 1',time:'',tools:'Premiere Pro · After Effects',yt:'SOr_mlN4ipo'},
  {id:'bk2',cats:['book'],title:'아르테미스',by:'앤디 위어',en:'BOOK 2',time:'',tools:'Premiere Pro · After Effects',ratio:'9:16',yt:'D7FgB9M5_n8'},
  {id:'bk3',cats:['book'],title:'모순',by:'양귀자',en:'BOOK 3',time:'',tools:'Premiere Pro · After Effects',ratio:'9:16',yt:'hZVVFRppHfk'},
  {id:'bk4',cats:['book'],title:'프로젝트 헤일메리',by:'앤디 위어',en:'BOOK 4',time:'',tools:'Premiere Pro · After Effects',yt:'tf5FNmodBmU'},
  {id:'knight',cats:['ani','team'],title:'흑기사',en:'BLACK KNIGHT',time:'3:20',year:2026,tools:'After Effects · Photoshop',team:'4인 팀',role:'연출 · 애니메이션',yt:'',
   story:'흑기사의 줄거리를 적어 주세요.',intent:'이 작품을 만든 이유를 적어 주세요.',
   process:[['레퍼런스','분위기와 비주얼 방향을 정하려고 참고 자료를 모았어요.'],['스토리보드','주요 장면과 시퀀스를 그림으로 짰어요.'],['애니메이션','연출에 맞춰 장면을 움직이고 완성했어요.']]},
  {id:'lint',cats:['ani'],title:'린트',en:'LINT',time:'',year:2026,tools:'Seedance · Premiere Pro',state:'wip',yt:'',
   story:'침대 밑 먼지 세계에 사는 여섯 친구의 이야기예요.'},
  {id:'chicken',cats:['ani'],title:'치킨',en:'CHICKEN',time:'',year:2026,state:'soon',yt:''},
  {id:'sangsang',cats:['team'],title:'상상 홈페이지',en:'SANGSANG',time:'',year:2026,tools:'Figma · HTML',team:'팀',role:'웹 디자인',yt:''},
  ...[1,2,3].map(n=>({id:'sc'+n,cats:['school'],title:'학원 실습 '+n,en:'CLASS '+n,time:'0:30',year:2025,tools:'After Effects',yt:''})),
];
WORKS.forEach((w,i)=>{w.bg=T[i%T.length]});

/* ===================================================================== */
const byId=id=>WORKS.find(w=>w.id===id), inCat=c=>c==='all'?WORKS:WORKS.filter(w=>w.cats.includes(c));
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const PLAY='<svg viewBox="0 0 12 12" fill="currentColor"><path d="M2 1l9 5-9 5z"/></svg>';
const ICON={
  mark:svg('<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>'),
  home:svg('<path d="M3 11l9-8 9 8M5 9v11h14V9"/>'),
  mail:svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
  back:svg('<path d="M15 5l-7 7 7 7"/>'),
  grid:svg('<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>'),
  ad:svg('<path d="M4 10v4h3l8 5V5l-8 5z"/><path d="M19 9a4 4 0 0 1 0 6"/>'),
  book:svg('<path d="M4 5a2 2 0 0 1 2-2h6v16H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-6v16h6a2 2 0 0 1 2 2z"/>'),
  film:svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>'),
  team:svg('<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14a5 5 0 0 1 5 5"/>'),
  cap:svg('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 3 9 3 12 0v-5"/>'),
  user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  phone:svg('<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'),
  pc:svg('<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
};
// 유튜브는 파일을 더블클릭해서 연 화면(file://)에서는 이 창 안 재생을 막아요. 그때는 유튜브에서 열리게 해요
const CAN_EMBED=location.protocol!=='file:';
const ytLink=w=>tall(w)?`https://www.youtube.com/shorts/${w.yt}`:`https://www.youtube.com/watch?v=${w.yt}`;
const ytFrame=(id,q,title)=>`<iframe src="https://www.youtube.com/embed/${id}?${q}" title="${title}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
const metaOf=w=>[w.by,w.year,w.time,w.team].filter(Boolean).join(' · ');
const tall=w=>w.ratio==='9:16';   // 세로 영상(쇼츠)
const badge=w=>w.state==='wip'?'<span class="bdg">제작 중</span>':w.state==='soon'?'<span class="bdg">준비 중</span>':'';
function thumb(w,tag='div',attrs=''){
  const hq=`https://img.youtube.com/vi/${w.yt}/hqdefault.jpg`;
  // 세로 영상은 세로 썸네일(oar2)을 쓰고, 없으면(작은 대체 그림이 오면) 기본 썸네일로 바꿔요
  const img=!w.yt?`<span>${w.en}</span>`
    :tall(w)?`<img src="https://i.ytimg.com/vi/${w.yt}/oar2.jpg" onload="if(this.naturalWidth<=120){this.onload=null;this.src='${hq}'}" onerror="this.onerror=null;this.src='${hq}'" alt="">`
    :`<img src="${hq}" alt="">`;
  return `<${tag} class="thumb" ${attrs} style="background:${w.bg}">${img}${badge(w)}${w.state==='soon'?'':`<span class="pl">${PLAY}</span>`}</${tag}>`;
}

/* 문의 창 */
function openContact(about){
  dlgAbout.textContent=about?`「${about}」에 대해 문의해요.`:'영상 제작 문의를 받아요.';
  dlgMail.href='mailto:'+CONTACT.email+'?subject='+encodeURIComponent('[영상 문의] '+(about||'포트폴리오를 보고 연락드립니다'));
  dlgMailV.textContent=CONTACT.email;
  dlgTel.href='tel:'+CONTACT.phone.replace(/[^0-9+]/g,'');
  dlgTelV.textContent=CONTACT.phone;
  dlg.showModal();
}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* 앱 만들기 */
function buildApp(root,opt){
  const st={cat:opt.cat||'all',cur:null,tab:'story',seen:[]};
  let wide=false, H='div';   // 화면 제목(h1)은 지금 보이는 배치에 하나만 둬요
  const pick=()=>{wide=root.offsetWidth>=900;H=opt.live&&!wide?'h1':'div'};
  root.innerHTML=`<div class="shell">
    <header class="bar"><span class="brand">${ICON.mark}<span><b>${CONTACT.name}</b><span>영상 포트폴리오</span></span></span>
      <span class="here only-wide"></span><span class="sp"></span>
      <button class="view" data-act="view"><span class="to-mob">${ICON.phone}모바일 보기</span><span class="to-pc">${ICON.pc}PC 버전</span></button>
      <span class="tbl only-wide"><span>영상</span><b class="num">${WORKS.length}</b></span></header>
    <nav class="nav" aria-label="분류"></nav>
    <main class="main"></main>
    <div class="dock"><button class="btn ghost only-narrow" data-act="home">${ICON.home}처음으로</button>
      <span class="seen only-wide">본 영상 <b class="num">0</b>편</span>
      <button class="btn prim" data-act="contact">${ICON.mail}연락 문의하기</button></div>
    <div class="modal" hidden></div></div>`;
  const $=s=>root.querySelector(s);

  function nav(){
    $('.nav').innerHTML=CATS.map(c=>`<button data-act="cat" data-id="${c.id}" aria-current="${c.id===st.cat}">${ICON[c.icon]}<span>${c.name}</span></button>`).join('')
      +`<span class="line only-wide"></span><button class="only-wide" data-act="contact">연락 문의</button><button class="only-wide" data-act="home">처음으로</button>`;
    const c=CATS.find(x=>x.id===st.cat);
    const HH=opt.live&&wide&&c.id!=='intro'?'h1':'div';
    $('.here').innerHTML=`<${HH} class="hname">${c.name}</${HH}><span>${c.id==='intro'?CONTACT.role:'영상 '+inCat(c.id).length+'편'}</span>`;
  }
  function banner(c){
    const label=c.id==='all'?'소개 영상':c.name+' 배너 영상';
    return `<div class="banner">${c.banner&&CAN_EMBED?ytFrame(c.banner,`autoplay=1&mute=1&loop=1&playlist=${c.banner}&controls=0&rel=0&playsinline=1`,label)
      :`<span class="bp">${PLAY}</span><span>${label}이 들어갈 자리</span>`}</div>`;
  }
  function list(){
    const c=CATS.find(x=>x.id===st.cat), ws=inCat(st.cat);
    return `${banner(c)}<div class="trow"><${H} class="title">${c.name}</${H}><span class="cnt num">${ws.length}편</span></div>
      <div class="grid">${ws.map(w=>{const off=w.state==='soon';return `<article class="card ${off?'off':''} ${tall(w)?'tall':''}" ${off?'':`data-act="open" data-id="${w.id}"`}>
        ${thumb(w)}
        <div class="info"><h3>${w.title}</h3><p class="meta num">${metaOf(w)}</p>
        <button class="more" ${off?'disabled':''} ${off?'':`aria-label="${w.title} 설명 보기"`}>${off?'준비 중':'설명 보기'}</button></div></article>`}).join('')}</div>`;
  }
  function intro(){
    const y=PROFILE.youtube;
    return `<div class="bigphoto">${PROFILE.photo?`<img src="${PROFILE.photo}" alt="${CONTACT.name}">`:'프로필 사진이 들어갈 자리'}</div>
      <div class="profile"><${opt.live?'h1':'div'} class="title">${CONTACT.name}</${opt.live?'h1':'div'}><p class="role">${CONTACT.role}</p>
        <p class="intro">${PROFILE.intro}</p>
        <h2>자격증</h2><table class="hist"><tbody>${PROFILE.certs.map(h=>`<tr><td class="num">${h[0]}</td><td>${h[1]}</td></tr>`).join('')}</tbody></table>
        <h2>유튜브 채널</h2><a class="yt" ${y.url?`href="${y.url}" target="_blank" rel="noopener"`:''}>${ICON.mark}<div><b>${y.name}</b><span>${y.url||'채널 주소를 넣으면 연결돼요'}</span></div></a>
        <h2>사용 툴</h2><div class="tools">${PROFILE.tools.map(t=>`<span>${t}</span>`).join('')}</div></div>`;
  }
  function pane(){
    const w=st.cur;
    root.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===st.tab));
    $('.pane').innerHTML=st.tab==='process'
      ?(w.process?`<ol class="steps">${w.process.map(s=>`<li><b>${s[0]}</b>${s[1]}</li>`).join('')}</ol>`:'제작 과정을 정리하고 있어요.')
      :(w[st.tab]||(st.tab==='story'?'영상 내용을 정리하고 있어요.':'기획 의도를 정리하고 있어요.'));
  }
  function openWork(w){
    st.cur=w; st.tab='story'; st.seen=[w.id,...st.seen.filter(x=>x!==w.id)];
    $('.seen b').textContent=st.seen.length;
    const m=$('.modal'); m.hidden=false;
    m.innerHTML=`<div class="dlg" role="dialog" aria-label="${w.title}">
      <div class="dtop"><button class="btn ghost" data-act="back">${ICON.back}목록으로</button></div>
      <div class="pv"><div class="player ${tall(w)?'tall':''}">${!w.yt?thumb(w)
        :CAN_EMBED?ytFrame(w.yt,'autoplay=1&rel=0&playsinline=1',w.title)
        :thumb(w,'a',`href="${ytLink(w)}" target="_blank" rel="noopener" aria-label="${w.title} 유튜브에서 보기"`)}</div>
        ${w.yt&&!CAN_EMBED?'<p class="ytnote">파일을 바로 연 화면에서는 유튜브가 이 창 안에서 재생되지 않아요. 영상을 누르면 유튜브에서 열려요. 인터넷에 올린 주소에서는 이 자리에서 바로 재생돼요.</p>':''}</div>
      <div class="dr"><h2>${w.title}</h2><p class="meta num">${[metaOf(w),w.role&&'내 역할 '+w.role,w.tools].filter(Boolean).join(' · ')}</p>
        <div class="tabs" role="tablist">${[['story','영상 내용'],['intent','기획 의도'],['process','제작 과정']].map(t=>`<button role="tab" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>
        <div class="pane"></div>
        <button class="btn prim ask" data-act="contact" data-about="${w.title}">${ICON.mail}이 영상으로 문의하기</button></div></div>`;
    pane();
  }
  function closeWork(){st.cur=null;const m=$('.modal');m.hidden=true;m.innerHTML=''}
  function render(){
    pick(); nav();
    $('.main').innerHTML=st.cat==='intro'?intro():list();
    $('.main').scrollTop=0;
  }
  root.addEventListener('click',e=>{
    if(e.target.classList.contains('modal')){closeWork();return}
    const b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
    const a=b.dataset.act, id=b.dataset.id;
    if(a==='cat'){closeWork();st.cat=id;render()}
    else if(a==='open'){openWork(byId(id))}
    else if(a==='back'){closeWork()}
    else if(a==='tab'){st.tab=id;pane()}
    else if(a==='contact'){openContact(b.dataset.about||'')}
    else if(a==='home'){closeWork();st.cat='all';render()}   // 처음으로 = 전체 화면 맨 위
    else if(a==='view'){setMode(document.body.dataset.mode==='pc'?'mob':'pc')}
  });
  if(opt.live)new ResizeObserver(()=>{const was=wide;pick();if(was!==wide)render()}).observe(root);
  if(opt.live)addEventListener('keydown',e=>{if(e.key==='Escape'&&st.cur&&!dlg.open)closeWork()});
  render();
}

/* 보기 방식: 'pc' 또는 'mob'
   - PC 보기: 화면 가득. 화면 폭이 900px보다 좁으면(휴대폰) 1200px 폭 PC 화면을 통째로 줄여서 보여줘요
   - 모바일 보기: 휴대폰 폭 그대로 */
const PC_W=1200, appEl=document.getElementById('app');
function fit(){
  const s=document.body.dataset.mode==='pc'&&innerWidth<900?innerWidth/PC_W:1;
  appEl.style.setProperty('--s',s);
  document.body.toggleAttribute('data-small',s<1);
}
function setMode(m){document.body.dataset.mode=m;fit()}
addEventListener('resize',fit);
const Q=new URLSearchParams(location.search);   // 주소 뒤에 ?mode=pc 또는 ?mode=mob 을 붙이면 그 화면으로 바로 열려요
// 처음 들어올 때: 휴대폰(좁은 화면)이면 모바일 보기, 아니면 PC 보기
const isPhone=Math.min(screen.width,screen.height)<700||innerWidth<700;
setMode(['mob','pc'].includes(Q.get('mode'))?Q.get('mode'):isPhone?'mob':'pc');
buildApp(appEl,{live:true,cat:CATS.some(c=>c.id===Q.get('cat'))?Q.get('cat'):'all'});
</script>
</body>
</html>
