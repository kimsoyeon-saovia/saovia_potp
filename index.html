<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KIM SO YEON 영상 포트폴리오</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap&text=%EB%82%98%EC%9E%90%EC%8B%A0%EB%8F%84%EC%98%81%EC%83%81%EA%B3%84%EC%86%8D%EB%A7%8C%EB%93%A4%EC%96%B4%EA%B0%91%EB%8B%88%EB%8B%A4%20" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&display=swap&text=%E2%80%9C%E2%80%9D%ED%87%B4%EC%82%AC%EB%8A%94%ED%95%98%EA%B3%A0%EC%8B%B6%EC%A7%80%EB%A7%8C%2C%ED%95%A0%EB%B6%80%EA%B0%80%EB%82%A8%EC%95%98%EB%8B%A4.%20">
<style>
@font-face{font-family:Orbit;src:url("fonts/Orbit-Regular.ttf") format("truetype");font-display:swap}
/* =====================================================================
   디자인 기준 (이탈리아 모더니즘 포스터 방식)
   글자 : Pretendard 한 가지만. 크기와 굵기 차이로만 위아래를 나눠요 (가는 획이 없어서 화면에서 깨지지 않아요)
   색   : 네이비(글자·머리줄) / 코발트 블루(지금 고른 것·누르는 것·재생 시간) / 흰 바탕 / 옅은 회청색(구분)
   선   : 굵은 네이비 선(3px)이 구역을 나누고, 글자는 그 선 아래에 왼쪽 맞춤으로 매달려요
   모양 : 영상은 모서리 각지게, 버튼만 살짝 둥글게
===================================================================== */
:root{
  --ink:#111111; --ink-2:#2B2B2B; --cobalt:#111111; --cobalt-d:#000000;   /* 파랑 없이 검정 */
  --paper:#ffffff; --mist:#F4F4F4; --line:#E4E4E4; --control:#C9C9C9; --slate:#6B6B6B;
  --ui:Orbit,"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --rule:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{word-break:keep-all;font-family:var(--ui);font-weight:400;color:var(--ink);background:var(--mist);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ================= 보기 화면 =================
   PC 보기: 화면 가득 (화면이 좁은 휴대폰에서는 1200px 폭 PC 화면을 통째로 줄여서 보여줘요)
   모바일 보기: 휴대폰 폭(430px) 그대로, 틀 없이 */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--mist)}
#app{margin:0 auto;background:var(--paper)}
body[data-mode="mob"] #app{width:min(430px,100%);box-shadow:0 0 0 1px var(--line)}
body[data-mode="pc"] #app{margin:0;width:calc(100%/var(--s,1));height:calc(100%/var(--s,1));transform:scale(var(--s,1));transform-origin:0 0}
/* 휴대폰에서 PC 보기일 때: 화면 아래에 원래 크기로 뜨는 돌아가기 버튼 */
#backMob{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 8px 24px rgba(17,17,17,.32)}
#backMob svg{width:18px;height:18px}
body[data-mode="pc"][data-small] #backMob{display:inline-flex}

/* ================= 오프닝 화면 =================
   처음 들어오면 뜨는 화면. 위는 배너(16:9 그림·영상이 잘리지 않고 통째로), 아래는 버튼 두 개 */
#opening{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:0 clamp(20px,6vw,120px);background:#fff;color:#111}
body[data-open] #opening{display:flex}
.op-banner{position:relative;flex:none;width:100%;aspect-ratio:16/9;overflow:hidden;background:#fff}
.op-banner img,.op-banner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-banner iframe{position:absolute;left:50%;top:50%;width:max(100%,calc((100vh - 22vh)*16/9));aspect-ratio:16/9;transform:translate(-50%,-50%);border:0;pointer-events:none}
/* 아래: 이름(휴먼아미체 글자 그림) 가운데, 재생 버튼 오른쪽 */
.op-stack{position:relative;flex:none;width:min(100%,calc((100vh - clamp(28px,7vh,90px) - clamp(96px,20vh,200px))*16/9*.5))}
.op-foot{position:absolute;top:100%;left:0;flex:none;width:100%;height:auto;aspect-ratio:716/107;container-type:inline-size;display:flex;align-items:center;justify-content:center;padding:0}
.op-name{display:block;width:53cqw;height:auto;margin-right:4cqw}
.op-play{position:absolute;right:0;top:50%;transform:translateY(-50%);width:8.2cqw;aspect-ratio:1;border-radius:50%;border:.5cqw solid #111;background:#fff;color:#111;display:grid;place-items:center;transition:background .15s,color .15s,transform .1s}
.op-play:hover{background:#111;color:#fff}
.op-play:active{transform:translateY(-50%) scale(.95)}
.op-play svg{width:46%;height:46%;margin-left:8%}

/* ================= 앱: 좁으면 키오스크 배치, 넓으면 테이블 태블릿 배치 ================= */
.app{container:app/inline-size;height:100%}
.shell{position:relative;height:100%;display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-rows:72px minmax(0,1fr) auto;grid-template-areas:"bar bar" "nav main" "dock dock";background:var(--paper);color:var(--ink);font-size:14px;line-height:20px}

/* --- 키오스크(모바일): 네이비 머리줄 · 왼쪽 글자 분류 줄 · 오른쪽 메뉴 · 아래 큰 버튼 --- */
.bar{grid-area:bar;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px 0 16px}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand b{font-size:20px;line-height:1;font-weight:800;letter-spacing:-.015em;white-space:nowrap}
.brand small{font-size:12px;line-height:1;font-weight:500;color:rgba(255,255,255,.7)}
.sp{flex:1}
/* 보기 바꾸기 버튼: PC 보기 ↔ 모바일 보기 */
.view{flex:none;display:inline-flex;align-items:center;height:40px;padding:0 13px;border-radius:6px;border:1px solid rgba(255,255,255,.4);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.view:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7)}
.view svg{width:17px;height:17px}
.view span{display:inline-flex;align-items:center;gap:6px}
body[data-mode="pc"] .view .to-pc,body[data-mode="mob"] .view .to-mob{display:none}
.only-wide{display:none!important}
.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:17px;height:17px}
.btn.prim{background:var(--cobalt);color:#fff}
.btn.prim:hover{background:var(--cobalt-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--control)}
.btn.ghost:hover{background:var(--mist);border-color:var(--slate)}

/* 왼쪽 분류 줄: 아이콘 없이 글자만. 지금 고른 분류는 코발트 블록으로 채워요 */
.nav{grid-area:nav;display:flex;flex-direction:column;overflow-y:auto;background:#fff;border-right:1px solid var(--line);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:flex;align-items:center;min-height:62px;padding:10px 8px 10px 16px;font-size:14px;line-height:18px;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-align:left;border-bottom:1px solid var(--line);transition:background .15s,color .15s}
.nav button:hover{background:var(--mist)}
.nav button[aria-current="true"]{background:var(--cobalt);color:#fff;font-weight:700;border-bottom-color:var(--cobalt)}
.nav button:focus-visible{outline-offset:-3px}
.nav .n{display:none}
.main{grid-area:main;min-height:0;overflow:auto;padding:16px 16px 28px}
.dock{grid-area:dock;display:grid;grid-template-columns:1fr 1.8fr;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.dock .btn{height:56px;border-radius:10px;font-size:16.5px}
.dock .btn svg{width:20px;height:20px}

/* 분류 제목: 굵은 선 아래에 매달린 큰 글자 */
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 16px;padding-top:12px;border-top:var(--rule) solid var(--ink)}
.title{font-size:23px;line-height:28px;font-weight:800;letter-spacing:-.03em}
.cnt{color:var(--slate);font-size:13.5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;animation:show .4s both;animation-delay:calc(var(--i,0)*35ms)}
.card.off{cursor:default}
@keyframes show{from{opacity:0}}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;color:#fff}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.thumb .bgi{display:none}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.6)}
/* 재생 표시: 영상 왼쪽 아래 모서리에 붙는 작은 네모 */
.thumb .pl{position:absolute;left:0;bottom:0;width:30px;height:30px;background:var(--ink);color:#fff;display:grid;place-items:center;transition:background .2s}
.thumb .pl svg{width:10px;height:10px;margin-left:1px}
@media (hover:hover){
  .card:not(.off):hover .thumb img{transform:scale(1.04)}
  .card:hover .pl,a.thumb:hover .pl{background:var(--cobalt)}
  .card:not(.off):hover h3{color:var(--cobalt)}
}
.bdg{position:absolute;left:0;top:0;padding:4px 9px;background:#fff;color:var(--ink);font-size:12px;line-height:16px;font-weight:700}
.info{display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.card h3{min-width:0;font-size:15px;line-height:21px;font-weight:700;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
/* 제목 아래 줄: 왼쪽에 지은이·연도, 오른쪽에 재생 시간(메뉴판의 가격 자리) */
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px}
.meta{display:flex;align-items:center;min-width:0;overflow:hidden;font-size:12.5px;line-height:1;color:var(--slate)}
.meta span{white-space:nowrap;line-height:13px}
.meta span+span{margin-left:8px;padding-left:8px;border-left:1px solid var(--control)}
.time{flex:none;font-size:13.5px;line-height:1;font-weight:700;color:var(--cobalt)}
.time.wait{font-weight:500;color:var(--slate)}
/* 세로 영상(9:16) 카드: 두 줄 높이를 차지해서 옆의 가로 영상 두 개와 키가 맞아요 */
.card.tall{grid-row:span 2}
.card.tall .thumb{flex:1 1 auto;aspect-ratio:9/16}

/* 분류마다 맨 위에 들어가는 배너(메인은 16:9). 영상을 넣기 전에는 제목 화면이 떠 있어요 */
.banner{position:relative;container-type:inline-size;margin:-16px -16px 20px;aspect-ratio:16/9;background:var(--ink);color:#fff;overflow:hidden}
.banner iframe{position:absolute;left:0;top:50%;width:100%;aspect-ratio:16/9;transform:translateY(-50%);border:0;pointer-events:none}
/* 제목 화면: 위에 굵은 흰 선과 작은 글자 한 줄, 아래에 왼쪽 맞춤 큰 글자 */
.tc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:6cqw 6cqw 5cqw}
.tc-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:max(8px,1.3cqw);border-top:max(2px,.4cqw) solid #fff;font-size:clamp(11.5px,1.5cqw,19px);line-height:1.2;font-weight:500;color:rgba(255,255,255,.78)}
.tc-top b{font-weight:700;color:#fff}
.tc-top i{font-style:normal;font-weight:600}
.tc-name{margin-left:-.05em;font-size:var(--fs,12cqw);line-height:.9;font-weight:800;letter-spacing:-.045em;white-space:nowrap}
.bigphoto{margin:-16px -16px 24px;aspect-ratio:4/5;background:var(--mist);color:var(--slate);display:grid;place-items:center;font-weight:500;overflow:hidden}
.bigphoto{position:relative;background:#fff}
.bigphoto img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.bigphoto .cap{display:none}

/* 소개 */
.profile .title{font-size:32px;line-height:34px;letter-spacing:-.035em}
.profile .role{color:var(--slate);font-size:15px;font-weight:500;margin-top:8px}
.profile p.intro{font-size:15.5px;line-height:27px;margin-top:18px;max-width:34em}
.profile h2{font-size:15px;line-height:20px;font-weight:800;letter-spacing:-.01em;margin-top:36px;padding-top:12px;border-top:var(--rule) solid var(--ink)}
.hist{width:100%;border-collapse:collapse;margin-top:6px}
.hist td{padding:12px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.hist td:first-child{width:96px;color:var(--slate)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tools span{height:32px;padding:0 13px;border-radius:6px;border:1px solid var(--control);display:inline-flex;align-items:center;font-size:14px;font-weight:600}
.yt{display:flex;align-items:center;gap:14px;margin-top:14px;padding:16px 18px;border:1px solid var(--control);border-radius:8px;transition:background .15s,border-color .15s}
.yt:hover{background:var(--mist);border-color:var(--slate)}
.yt svg{flex:none;width:28px;height:28px;color:var(--cobalt)}
.yt b{display:block;font-weight:700;font-size:15.5px;line-height:22px}
.yt span{font-size:13px;color:var(--slate)}

/* 영상 상세 (메뉴를 눌렀을 때 뜨는 창) */
.modal{grid-row:2;grid-column:1/-1;z-index:2;background:#fff;overflow:auto;padding:14px 16px 24px}
.dlg{animation:show .25s both}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.player{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--ink)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .thumb{height:100%;aspect-ratio:auto}
.player .thumb .ph{font-size:24px}
.player .thumb .pl{left:50%;top:50%;bottom:auto;width:64px;height:64px;margin:-32px 0 0 -32px}
.player .thumb .pl svg{width:20px;height:20px;margin-left:3px}
.player.tall{aspect-ratio:9/16;width:62%;margin:0 auto}   /* 세로 영상은 세로 화면으로 재생 */
.player.site{aspect-ratio:16/10;background:#fff;border:1px solid var(--line)}
.player.site iframe{inset:auto;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}   /* PC 화면 크기로 띄우고 줄여서 보여줘요 */
.sitebar{display:flex;gap:8px;margin-top:10px}
.sitebar .btn{flex:1}
.thumb.site img{object-fit:cover;object-position:top}
.thumb .web{position:absolute;right:0;bottom:0;padding:3px 8px;background:var(--ink);color:#fff;font-size:12px;line-height:16px;font-weight:600}
.ytnote{margin-top:10px;font-size:13px;line-height:19px;color:var(--slate)}
.dr{margin-top:20px;padding-top:14px;border-top:var(--rule) solid var(--ink)}
.dr h2{font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.03em}
.dr .meta{flex-wrap:wrap;row-gap:8px;margin-top:10px;font-size:13.5px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:22px}
.tabs button{height:42px;color:var(--slate);font-weight:500;font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--cobalt)}
.pane{padding-top:18px;font-size:15px;line-height:26px;min-height:120px}
.steps{padding-left:20px}
.steps li{margin-bottom:14px}
.steps b{display:block;font-weight:700}
.ask{margin-top:20px;height:52px;width:100%;font-size:15.5px;border-radius:10px}

/* --- 테이블 태블릿(PC): 흰 머리줄 · 왼쪽 글자 메뉴 · 3열 사진 · 오른쪽 아래 버튼 --- */
@container app (min-width:900px){
  .shell{grid-template-columns:240px minmax(0,1fr);grid-template-rows:76px minmax(0,1fr) 80px;grid-template-areas:"bar bar" "nav main" "nav dock"}
  .only-wide{display:flex!important}
  .only-narrow{display:none!important}
  .bar{background:#fff;color:var(--ink);border-bottom:var(--rule) solid var(--ink);padding:0 32px 0 0;gap:0}
  .brand{width:240px;padding-left:28px}
  .brand b{font-size:22px;letter-spacing:-.02em}
  .brand small{display:none}
  .here{flex-direction:column;gap:3px;padding-left:32px}
  .here .hname{font-size:18px;line-height:24px;font-weight:700;letter-spacing:-.02em}
  .here span{font-size:13px;line-height:16px;color:var(--slate)}
  .view{margin-right:12px;height:44px;padding:0 16px;border-color:var(--control);color:var(--ink);font-size:14px}
  .view:hover{background:var(--mist);border-color:var(--slate)}
  .tbl{flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:76px;height:44px;border:1px solid var(--control);border-radius:6px}
  .tbl span{font-size:11.5px;line-height:13px;color:var(--slate)}
  .tbl b{font-size:17px;line-height:19px;font-weight:800}
  .nav{padding:0}
  .nav button{justify-content:space-between;min-height:0;height:58px;padding:0 24px 0 28px;font-size:17px;line-height:24px;font-weight:600}
  .nav button:hover{background:var(--mist)}
  .nav button[aria-current="true"]{background:var(--cobalt);color:#fff;font-weight:700}
  .nav .n{display:inline;font-size:13px;font-weight:600;color:var(--slate)}
  .nav button[aria-current="true"] .n{color:rgba(255,255,255,.8)}
  .nav .line{flex:none;height:20px}
  .nav .line~button{height:46px;border-bottom:0;font-size:15px;font-weight:500;color:var(--slate)}
  .nav .line~button:hover{background:none;color:var(--ink)}
  .main{padding:32px 32px 48px}
  .trow{display:none}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 24px}
  .card{gap:14px}
  .thumb .ph{font-size:19px}
  .thumb .pl{width:38px;height:38px}
  .thumb .pl svg{width:12px;height:12px}
  .card.tall .thumb{aspect-ratio:3/4}          /* 넓은 화면: 가로 카드 두 줄 높이에 맞추고 */
  .card.tall .thumb img{object-fit:contain}   /* 세로 썸네일은 자르지 않고 통째로 */
  .card.tall .thumb .bgi{display:block;inset:-30%;width:160%;height:160%;object-fit:cover;filter:blur(34px)}   /* 양옆 빈 곳은 같은 그림을 흐리게 */
  .player.tall{width:300px}
  .info{gap:6px}
  .card h3{font-size:17px;line-height:24px}
  .meta{font-size:14px}
  .meta span{line-height:14px}
  .time{font-size:15.5px}
  .banner{margin:-32px -32px 40px}
  .banner.strip{aspect-ratio:3/1}            /* 분류 배너는 낮게: 아래 영상이 바로 보이도록 */
  .banner.strip .tc{padding-top:3.4cqw;padding-bottom:3cqw}
  .bigphoto{margin:-32px -32px 36px;aspect-ratio:auto;height:440px}
  .bigphoto{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:100%;place-items:stretch;background:var(--ink)}
  .bigphoto img{min-height:0}
  .bigphoto img{grid-column:2;grid-row:1;object-position:center 22%}
  .bigphoto .cap{display:block;grid-column:1;grid-row:1;align-self:end;padding:0 56px 52px;color:#fff;text-align:left}
  .bigphoto .cap b{display:block;font-size:56px;line-height:56px;font-weight:800;letter-spacing:-.035em}
  .bigphoto .cap span{display:block;margin-top:12px;font-size:17px;color:#BDBDBD;font-weight:500}
  .bigphoto:has(.cap)+.profile>.title,.bigphoto:has(.cap)+.profile>.role{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}   /* PC는 사진 위 이름이 제목 역할 */
  .bigphoto:has(.cap)+.profile>.intro{margin-top:0}
  .profile{max-width:720px}
  .profile .title{font-size:52px;line-height:52px}
  .profile .role{font-size:16px;margin-top:12px}
  .profile p.intro{font-size:17px;line-height:30px}
  .dock{display:flex;justify-content:flex-end;align-items:center;gap:24px;padding:0 32px}
  .dock .seen{font-size:15px;color:var(--slate)}
  .dock .seen b{margin:0 2px 0 5px;font-size:20px;font-weight:800;color:var(--ink)}
  .dock .btn{height:52px;width:280px;border-radius:8px;font-size:17px}
  .modal{grid-row:1/-1;z-index:5;display:grid;place-items:center;padding:36px;background:rgba(17,17,17,.78);backdrop-filter:blur(3px)}
  .dlg{width:min(1120px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:10px;padding:20px 28px 28px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0 32px;align-content:start}
  .dtop{grid-column:1/-1;margin-bottom:18px}
  .dr{margin-top:0;display:flex;flex-direction:column}
  .dr h2{font-size:30px;line-height:36px}
  .pane{flex:1}
  .ask{border-radius:8px}
}

/* 문의 창 */
dialog{margin:auto;border:0;border-radius:14px;padding:26px 24px 24px;width:min(372px,calc(100vw - 32px));color:var(--ink);box-shadow:0 20px 60px rgba(17,17,17,.3)}
dialog::backdrop{background:rgba(17,17,17,.6)}
dialog h2{font-size:23px;line-height:30px;font-weight:800;letter-spacing:-.03em}
dialog .about{color:var(--slate);margin-top:6px}
.way{display:flex;align-items:center;gap:14px;margin-top:10px;padding:15px 18px;border-radius:10px;border:1px solid var(--control);transition:background .15s,border-color .15s}
.way:hover{background:var(--mist);border-color:var(--slate)}
.way.first{margin-top:22px;background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.way.first:hover{background:var(--cobalt-d);border-color:var(--cobalt-d)}
.way svg{flex:none;width:24px;height:24px}
.way b{display:block;font-weight:700;font-size:15.5px;line-height:22px}
.way span{font-size:13.5px}
dialog .btn{width:100%;height:46px;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= 새 디자인 (v2): 민트 바탕, 위 메뉴 상자, 왼쪽 현재 분류 검은 상자 =================
   선택된 것 = 검은 상자 + 바탕색 글자 */
:root{--bg2:#ffffff}
#stage{background:var(--bg2)}
.shell.v2{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top" "main";

.v2 .nav button{all:unset;box-sizing:border-box;cursor:pointer;position:relative;padding:10px 22px;font-size:clamp(18px,1.5vw,23px);color:#111;text-align:center;background:#fff;border:9px solid transparent;border-image:url("img/brush/frame.png") 28 / 9px / 0 stretch}

.v2 .nav button:hover{opacity:.75}
.v2 .nav button:focus-visible{outline:2px solid #111;outline-offset:3px}
.v2 .main{grid-area:main;overflow:auto;padding:0 24px 96px;background:transparent}
.v2 .modal{grid-area:1/1/-1/-1}
/* 소개 — 이력서 한 장처럼: 회색 면 안에서 왼쪽 제목 칸(200px) · 오른쪽 내용 칸으로 모든 줄을 맞춰요 */
.v2 .main{padding-left:0;padding-right:0;padding-top:clamp(28px,4vh,48px)}
.pf{--g:#fff;--ink:#1a1a1a;--mute:#5c5c5c;--lab:200px;--pad:clamp(20px,4vw,56px);--ko:Orbit,sans-serif;font-family:var(--ko);font-weight:400;color:var(--ink)}
.pf-in{max-width:1040px;margin:0 auto;padding:0 var(--pad)}
.pf h1,.pf h2,.pf h3{font-weight:700;margin:0}

.pf-p+.pf-p{margin-top:0;border-top:1.5px solid #111}

.pf-row>h2{font-size:17px;line-height:1.6;letter-spacing:.02em}
/* 첫 칸: 사진 · 소개 문장 · 이름 */

.pf-hero .tag{font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:var(--mute);margin:0 0 10px}

/* 경력 · 자격증 */

.pf-item .when{font-size:14.5px;color:var(--mute)}
.pf-item .what{font-size:18px;font-weight:700;line-height:1.5;margin-top:2px}
.pf-item ul{list-style:none;margin:8px 0 0;padding:0;font-size:16px;line-height:1.85}

/* 사용 툴 */

/* 소개: 붓 테두리 상자 하나 — 위: 사진·이름 | 경력 | 자격증 (머리줄 한 줄로 맞춤) / 아래: 보유 기술·툴 | 유튜브 채널 */
.pf3{max-width:1560px;margin:0 auto;padding:0 clamp(16px,2.6vw,48px) 80px}
.pf3 .bx{background:#fff;padding:clamp(32px,3.4vw,60px);border:16px solid transparent;border-image:url("img/brush/frame.png") 28 / 16px / 0 stretch}
.pf3 .sec>h2{position:relative;font-size:24px;font-weight:700;line-height:1.3;margin:0 0 30px;display:flex;align-items:center;gap:10px}

.pf3 .p3-head{display:grid;grid-template-columns:170px max-content minmax(0,1.5fr) minmax(0,1fr);gap:0 clamp(28px,3vw,52px);align-items:start;padding-bottom:clamp(56px,5vw,80px);border-bottom:2px solid #111}
.pf3 .ph{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;display:block;align-self:end}
.pf3 .who{align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end}
.pf3 .who .tag{font-size:clamp(16px,1.3vw,19px);line-height:1.4;color:#5c5c5c;margin:0 0 22px;white-space:nowrap}
.pf3 .who .ko-name{font-size:clamp(44px,4vw,62px);font-weight:700;line-height:.8;margin:0;position:relative;top:-.17em}
.pf3 .pf-item .when{font-size:14px;color:#777;line-height:1.6}
.pf3 .pf-item .what{font-size:18px;font-weight:700;margin-top:4px;line-height:1.5}
.pf3 .pf-item ul{list-style:none;margin:10px 0 0;padding:0;font-size:15px;line-height:2}
.pf3 .pf-item .o{font-size:14px;color:#777;margin-top:2px}
.pf3 .pf-item+.pf-item{margin-top:28px}
.pf3 .p3-body{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:0 clamp(44px,5vw,88px);padding-top:clamp(56px,5vw,80px)}
.pf3 .p3-body>.p3yt{display:block;padding-left:clamp(36px,4vw,72px);border-left:1px solid #ddd}
.pf3 .sec+.sec{margin-top:72px}
.pf3 .p3-head .sec{margin-top:0}
.pf3 .p3-body{align-items:start}
.pf3 .sk{list-style:none;margin:0;padding:0}
.pf3 .sk li{padding:20px 0}
.pf3 .sk li:first-child{padding-top:0}
.pf3 .sk b{display:block;font-size:17px;font-weight:700;margin-bottom:8px}
.pf3 .sk p{margin:0;font-size:15px;line-height:1.9;color:#555}
.pf3 .pf-tools .grp+.grp{margin-top:24px}
.pf3 .pf-tools .lb{font-size:14px;color:#777;margin-bottom:12px}
.pf3 .pf-tools ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pf3 .pf-tools li{background:#f4f4f4;padding:10px 14px;font-size:14.5px;line-height:1}
.pf3 .ch+.ch{margin-top:64px}
.pf3 .ch .nm{font-size:18px;font-weight:700;color:#111;text-decoration:none;display:inline-flex;align-items:center}
.pf3 .ch .nm i{font-style:normal;margin-left:6px;font-size:.8em}
.pf3 .ch .h{font-size:13px;color:#777;margin-left:8px}
.pf3 .ch p{font-size:15px;line-height:2;margin:12px 0 20px;color:#333}
.pf3 .ch-v{display:grid;gap:10px}
.pf3 .ch-v.s4{grid-template-columns:repeat(4,minmax(0,1fr))}.pf3 .ch-v.w4{grid-template-columns:repeat(4,minmax(0,1fr))}.pf3 .ch-v.w2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pf3 .ch-v a{display:block}

.pf3 .ch-v.s4 img{aspect-ratio:9/16}
@media (max-width:1100px){.pf3 .p3-head{grid-template-columns:140px minmax(0,1fr);gap:28px}.pf3 .p3-head .sec{grid-column:1/-1}.pf3 .p3-body{grid-template-columns:1fr}.pf3 .p3-body>.p3yt{display:block;padding-left:0;border-left:0;margin-top:44px}}
/* 분류 페이지: 소개처럼 가운데 적당한 폭 */
.v2 .lst{max-width:1080px;margin:0 auto;padding:0 clamp(20px,4vw,64px)}
.v2 .lst .banner{margin:0 0 28px}
/* 좁은 화면(모바일): 메뉴는 줄바꿈, 왼쪽 상자는 위로 */
@container app (width < 760px){
  .v2 .top{padding:16px 16px 0}

}
/* 휴대폰: 작품 페이지는 한 줄로 (영상 → 글) */
@media (max-width:1100px){.ft-grid,.ft-grid.txt{grid-template-columns:minmax(0,1fr)}.ft-chars{grid-template-columns:1fr}}

body[data-mode="mob"] .pf3 .bx{padding:24px 16px}
.ft-head{grid-column:1/-1;text-align:center}
.ft-head .ft-title{font-size:clamp(46px,4.2vw,70px);white-space:nowrap;margin:0 0 8px}
.ft-head .ft-title span{white-space:nowrap}
.pf3 .sk li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:baseline}
.pf3 .sk b{margin-bottom:0}

body[data-mode="mob"] .pf3 .sk li{grid-template-columns:1fr;gap:6px}


/* ===== 컨택트 시트 디렉션: 흑연 바탕 · 밝은 회색 글자 · 오렌지 하나 · 영상 스틸이 곧 화면 ===== */
:root{--bg:#ffffff;--surface:#f2f2f2;--ink:#0a0a0a;--muted:#6b6b6b;--accent:#d92b21;--accent-ink:#ffffff}
html,body,#app,.v2,.v2 .main,#stage{background:var(--bg)!important;color:var(--ink)}
.v2 .main{padding:0!important}
.v2 .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 clamp(16px,2.2vw,32px)!important;background:var(--bg)!important;margin:0!important}
.v2 .top::before{content:"KIM SO YEON";font-family:"Hanken Grotesk",Orbit,sans-serif;font-weight:500;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
.v2 .nav{all:unset;display:flex;gap:clamp(18px,2.4vw,40px)}
.v2 .nav::after{display:none}
.v2 .nav button{all:unset;cursor:pointer;position:relative;padding:6px 0;font-size:15px;color:var(--muted)}
.v2 .nav button>span{transform:none!important;writing-mode:horizontal-tb}
.v2 .nav button::before,.v2 .nav button::after{display:none!important}
.v2 .nav button[aria-current="true"]{color:var(--ink)}
.v2 .nav button[aria-current="true"]::after{display:block!important;content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.v2 .nav button:hover{color:var(--ink)}
.v2 .nav button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
/* 작품: 상자 없이 한 작품 = 한 띠, 바탕 톤을 번갈아 */
.fts{max-width:none!important;margin:0!important;padding:0!important}
.ft-page::before,.pf3 .bx::before{display:none!important}
.ft-page{margin:0!important}
.ft-page:nth-child(even){background:var(--surface)}
.ft-grid{max-width:1360px;margin:0 auto!important;border:0!important;border-image:none!important;background:none!important;border-radius:0!important;box-shadow:none!important;padding:clamp(80px,10vh,140px) clamp(16px,2.2vw,32px)!important;color:var(--ink);grid-template-columns:minmax(0,7fr) minmax(0,5fr)!important;gap:clamp(32px,4vw,72px)!important}
.ft-head{text-align:left!important;padding:0!important;margin:0 0 8px!important;border:0!important}
.ft-head .ft-title{font-family:"Hanken Grotesk",Orbit,sans-serif;font-weight:500;font-size:clamp(34px,3.4vw,56px)!important;letter-spacing:-.03em;line-height:1.05;text-align:left!important;color:var(--ink);white-space:normal!important;margin:0!important}
.ft-head .ft-title span{color:var(--muted);font-size:.5em!important;letter-spacing:0;margin-left:14px;font-weight:400}
.ft-tno{text-align:left!important;color:var(--ink)!important;font-size:15px!important;font-weight:700!important;margin:0 0 10px!important;letter-spacing:0}
.ft-play,.ft-player{border-radius:0!important}
.ft-play .pb{background:var(--accent)!important;color:var(--accent-ink)!important}
.ft-grid h3{font-size:15px!important;font-weight:700!important;color:var(--ink)!important;margin:0 0 12px!important;letter-spacing:0}
.ft-sec+.ft-sec{margin-top:36px!important}
.ft-body,.ft-syn,.ft-c p,.ft-steps li,.ft-c b{color:var(--ink)!important}
.ft-body,.ft-syn,.ft-steps li{font-size:16px!important;line-height:1.7!important}
.ft-syn{margin-top:28px}
.ft-c .m{color:var(--muted)!important}
.ft-c img{background:var(--surface)!important}
.ft-c.cut img{background:#fff!important;border:0!important}
/* 필름 대신 컨택트 시트 */
.film-wrap{display:flex!important;flex-wrap:wrap;gap:8px!important;margin-top:36px!important;padding:0!important;overflow:visible!important;flex-direction:row!important}
.film{all:unset!important;display:contents!important}
.film::before,.film::after{display:none!important}
.film img{flex:none!important;height:96px!important;width:auto!important;aspect-ratio:16/9!important;object-fit:cover;transition:filter .2s,transform .2s}
.film.v img{aspect-ratio:9/16!important;height:150px!important}
.film-wrap:hover img{filter:grayscale(1) opacity(.55)}
.film-wrap img:hover{filter:none!important;transform:scale(1.05)}
/* 프로그램 · 기술부분: 상자·아이콘 없이 양끝 정렬 줄 */
.ft-spec{all:unset;display:block!important;margin-top:44px!important}
.sp-row{display:flex!important;justify-content:space-between;gap:24px;padding:11px 0}
.sp-k{color:var(--muted)!important;font-size:14px;padding:0!important;flex:none}
.sp-v{font-size:15px;padding:0!important;text-align:right}
.tbs,.pills{all:unset;display:block;text-align:right;font-size:15px;line-height:1.6;color:var(--ink)}
.tbs li,.pills li{all:unset;display:inline}
.tbs li .tb{display:none!important}
.tbs li+li::before,.pills li+li::before{content:" / ";color:var(--muted)}
.ft-team a{color:var(--ink)!important}
.ft-team li b{color:var(--muted)}
.ft-scenes h3{color:var(--ink)}
.ft-scenes img{border:0!important}
.ft-scenes span,.ft-scenes b{color:var(--muted)!important}
.ft-quote{color:var(--ink)}
.ft-shot figcaption{color:var(--muted)}
/* 소개 */
.pf3{--ink:#0a0a0a;--muted:#6b6b6b;--mute:#6b6b6b;--g:transparent;max-width:none!important;margin:0!important;padding:0!important;color:var(--ink)}
.p3-ring{position:relative;height:min(92vh,880px);min-height:620px;overflow:hidden;background:var(--bg)}
.p3-ring a{position:absolute;display:block;transform:translate(-50%,-50%) rotate(var(--r));width:var(--w);transition:filter .2s}
.p3-ring a img{display:block;width:100%;aspect-ratio:var(--ar);object-fit:cover}
.p3-ring:has(a:hover) a:not(:hover){filter:brightness(.4)}
.p3-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,80vw);text-align:center;z-index:2}
.p3-core h1{font-family:Orbit,sans-serif;font-weight:700;font-size:clamp(54px,5.6vw,88px);letter-spacing:-.03em;line-height:1;margin:0;color:var(--ink)}
.p3-core p{font-size:18px;line-height:1.55;color:var(--ink);margin:22px auto 0;max-width:34ch}
.p3-core .go{display:inline-block;margin-top:26px;background:var(--accent);color:var(--accent-ink);padding:14px 26px;font-weight:700;text-decoration:none;cursor:pointer;border:0;font:inherit;font-weight:700}
.p3-inner{max-width:1360px;margin:0 auto;padding:clamp(100px,12vh,160px) clamp(16px,2.2vw,32px)}
.p3-about{display:grid;grid-template-columns:minmax(0,34fr) minmax(0,66fr);gap:40px}
.p3-photo{width:170px;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;display:block}
.p3-facts{margin:24px 0 0;display:grid;gap:18px}
.p3-facts dt{font-size:14px;color:var(--muted)}
.p3-facts dd{margin:2px 0 0;font-size:15px}
.p3-lead{font-size:clamp(20px,1.7vw,26px);line-height:1.5;margin:0 0 64px;max-width:36em}
.p3-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px 64px}
.p3-sec h2{font-size:clamp(26px,2.2vw,34px);font-weight:500;letter-spacing:-.03em;color:var(--ink);font-family:"Hanken Grotesk",Orbit,sans-serif;margin:0 0 14px}
.p3-row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;font-size:15px;line-height:1.5}
.p3-row span:first-child{flex:none;white-space:nowrap;font-weight:700}
.p3-row span:last-child{color:var(--muted);text-align:right}
.p3-band{background:var(--surface)}
.p3-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,110px)}
.p3-ch+.p3-ch{margin-top:56px}
.p3-ch a.nm{color:var(--ink);text-decoration:none;font-size:20px;font-weight:700}
.p3-ch .h{color:var(--muted);font-size:14px;margin-left:10px}
.p3-ch p{color:var(--ink);font-size:16px;line-height:1.7;margin:10px 0 16px}
.p3-ch .ch-v{display:flex;flex-wrap:wrap;gap:8px}
.p3-ch .ch-v a{display:block}
.p3-ch .ch-v .im{display:block}
.p3-ch .ch-v img{height:96px;width:auto;aspect-ratio:16/9;object-fit:cover;display:block}
.p3-ch .ch-v.s4 img{height:150px;aspect-ratio:9/16}
.p3-ch .ch-v.w2 img{height:150px}
.p3-ch .ch-v a:hover img{transform:scale(1.04)}
.p3-ch .ch-v img{transition:transform .2s}
/* 위로 버튼 */
#toTop{position:fixed;right:24px;bottom:28px;z-index:60;width:54px;height:54px;border-radius:50%;border:2.5px solid #111;background:#fff;color:#111;display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s,transform .15s}
#toTop.on{opacity:1;pointer-events:auto}
#toTop:hover{transform:translateY(-3px)}
#toTop svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.film img,.p3-ring a,.p3-ch .ch-v img{transition:none}}
/* 휴대폰 */
body[data-mode="mob"] .v2 .top{flex-direction:column;height:auto;padding:12px!important;gap:8px}
body[data-mode="mob"] .v2 .nav{flex-wrap:wrap;justify-content:center;gap:14px}
body[data-mode="mob"] .ft-grid{grid-template-columns:1fr!important;padding:56px 16px!important}

body[data-mode="mob"] .film.v img{height:110px!important}
body[data-mode="mob"] .p3-ring{height:620px;min-height:0}
body[data-mode="mob"] .p3-core h1{font-size:11vw}
body[data-mode="mob"] .p3-ring a{width:calc(var(--w)*.46)}

body[data-mode="mob"] .p3-core p{font-size:15px}
body[data-mode="mob"] .p3-about,body[data-mode="mob"] .p3-cols,body[data-mode="mob"] .p3-two{grid-template-columns:1fr}

/* 이름이 곧 기념비: 흰 바탕, 이름 한 줄, 단어 사이에 메인 배너 영상 */
.p3-mono{position:relative;min-height:calc(100vh - 68px);display:flex;flex-direction:column;justify-content:center;padding:0 clamp(16px,2.2vw,32px)}
.mono-name{display:flex;align-items:baseline;justify-content:center;gap:.12em;margin:0;font-family:"Hanken Grotesk",Orbit,sans-serif;font-weight:500;font-size:clamp(72px,10.5vw,168px);letter-spacing:-.05em;line-height:.9;color:var(--ink);white-space:nowrap}
.mono-vid{display:inline-block;width:1.7em;height:.72em;overflow:hidden;align-self:baseline;position:relative;top:.02em}
.mono-vid video{width:100%;height:100%;object-fit:cover;display:block}
.mono-foot{position:absolute;left:clamp(16px,2.2vw,32px);right:clamp(16px,2.2vw,32px);bottom:clamp(24px,4vh,40px);display:flex;justify-content:space-between;align-items:center;gap:24px}
.mono-foot p{margin:0;font-size:17px;line-height:1.5;max-width:40ch;color:var(--ink)}
.p3-mono .go,.p3-core .go{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;background:var(--accent);color:var(--accent-ink);border:0;font:inherit;font-weight:700;cursor:pointer}
.p3-mono .go:hover{background:#b3221a}
.mono-foot-band{background:#0a0a0a;color:#fff;font-family:"Hanken Grotesk",Orbit,sans-serif;font-weight:500;font-size:clamp(60px,13.4vw,220px);letter-spacing:-.05em;line-height:.85;white-space:nowrap;overflow:hidden;text-align:center;padding:clamp(40px,6vw,90px) 0 clamp(20px,3vw,40px)}
.ft-page:nth-child(even){background:var(--surface)}
.ft-play .pb{background:#fff!important;color:#0a0a0a!important}
@media (prefers-reduced-motion:reduce){.mono-vid video{display:none}.mono-vid{background:url(img/class-course.jpg) center/cover}}
body[data-mode="mob"] .mono-name{flex-direction:column;align-items:center;font-size:19vw;gap:12px}
body[data-mode="mob"] .mono-vid{width:calc(100vw - 32px);height:auto;aspect-ratio:3/2}
body[data-mode="mob"] .mono-foot{position:static;flex-direction:column;align-items:flex-start;margin-top:32px}
body[data-mode="mob"] .p3-mono{min-height:auto;padding-top:48px;padding-bottom:48px}
.p3-row{display:grid!important;grid-template-columns:140px minmax(0,1fr);gap:16px}
.p3-row span:last-child{text-align:left!important;color:#444!important}
.p3-row span:first-child{white-space:normal!important}
.ft-extra{margin-top:36px;max-width:62%}
.ft-extra p{margin:0 0 10px;font-size:15px;font-weight:700}
.ft-player.sm{aspect-ratio:16/9}
.ft-tno{font-size:clamp(17px,1.3vw,20px)!important}
body[data-mode="mob"] .ft-extra{max-width:none}

/* 소개 첫 화면: 왼쪽 위 큰 영상 + 오른쪽 소개 문장, 아래 이름 */
.p3-mono{min-height:calc(100vh - 68px)!important;display:flex!important;flex-direction:column;justify-content:space-between!important;padding:clamp(24px,4vh,48px) clamp(16px,2.2vw,32px) clamp(16px,3vh,32px)!important}
.mono-top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(24px,3vw,56px);align-items:end}
.mono-top .mono-vid{width:100%!important;height:auto!important;aspect-ratio:16/9;top:0!important}
.mono-tag{margin:0;font-size:clamp(17px,1.4vw,22px);line-height:1.6;color:var(--ink)}

function thumb(w,tag='div',attrs=''){
  const hq=`https://i.ytimg.com/vi/${w.yt}/hqdefault.jpg`, mx=`https://i.ytimg.com/vi/${w.yt}/maxresdefault.jpg`;

  if(w.shot) return `<${tag} class="thumb site" ${attrs} style="background:#fff"><img src="${w.shot}" alt="">${badge(w)}<span class="web">웹사이트</span></${tag}>`;
  if(w.mp4) return `<${tag} class="thumb" ${attrs} style="background:#000"><img src="${w.poster}" alt="" style="object-fit:contain">${badge(w)}<span class="pl">${PLAY}</span></${tag}>`;

const HC0=location.hash.slice(1), HC=HC0==='home'?'intro':HC0, hasHC=CATS.some(c=>c.id===HC);   // 주소 끝 #book 등 → 그 분류로 바로 열기 (새로고침해도 그대로)
