<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KIM SO YEON 영상 포트폴리오</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =====================================================================
   디자인 기준 (이탈리아 모더니즘 포스터 방식)
   글자 : Pretendard 한 가지만. 크기와 굵기 차이로만 위아래를 나눠요 (가는 획이 없어서 화면에서 깨지지 않아요)
   색   : 네이비(글자·머리줄) / 코발트 블루(지금 고른 것·누르는 것·재생 시간) / 흰 바탕 / 옅은 회청색(구분)
   선   : 굵은 네이비 선(3px)이 구역을 나누고, 글자는 그 선 아래에 왼쪽 맞춤으로 매달려요
   모양 : 영상은 모서리 각지게, 버튼만 살짝 둥글게
===================================================================== */
:root{
  --ink:#0A1238; --ink-2:#1A2456; --cobalt:#1E47E6; --cobalt-d:#1638BD;
  --paper:#ffffff; --mist:#F1F3F8; --line:#DFE3EC; --control:#C3C9D6; --slate:#5A6079;
  --ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --rule:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{word-break:keep-all;font-family:var(--ui);color:var(--ink);background:var(--mist);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ================= 보기 화면 =================
   PC 보기: 화면 가득 (화면이 좁은 휴대폰에서는 1200px 폭 PC 화면을 통째로 줄여서 보여줘요)
   모바일 보기: 휴대폰 폭(430px) 그대로, 틀 없이 */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--mist)}
#app{margin:0 auto;background:var(--paper)}
body[data-mode="mob"] #app{width:min(430px,100%);box-shadow:0 0 0 1px var(--line)}
body[data-mode="pc"] #app{margin:0;width:calc(100%/var(--s,1));height:calc(100%/var(--s,1));transform:scale(var(--s,1));transform-origin:0 0}
/* 휴대폰에서 PC 보기일 때: 화면 아래에 원래 크기로 뜨는 돌아가기 버튼 */
#backMob{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 8px 24px rgba(10,18,56,.32)}
#backMob svg{width:18px;height:18px}
body[data-mode="pc"][data-small] #backMob{display:inline-flex}

/* ================= 오프닝 화면 =================
   처음 들어오면 뜨는 화면. 위는 배너(16:9 그림·영상이 잘리지 않고 통째로), 아래는 버튼 두 개 */
#opening{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:var(--ink);color:#fff}
body[data-open] #opening{display:flex}
.op-banner{position:relative;flex:1;min-height:0;container-type:inline-size;overflow:hidden}
.op-banner img,.op-banner video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.op-banner iframe{position:absolute;left:50%;top:50%;width:min(100%,calc((100vh - 110px)*16/9));aspect-ratio:16/9;transform:translate(-50%,-50%);border:0;pointer-events:none}
.op-go{flex:none;display:flex;gap:12px;padding:0 6vw calc(28px + env(safe-area-inset-bottom))}
.op-go button{flex:1 1 0;max-width:300px;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:60px;border-radius:8px;background:#fff;color:var(--ink);font-size:17px;font-weight:700;white-space:nowrap;transition:background .15s,transform .1s}
.op-go button:hover{background:var(--mist)}
.op-go button:active{transform:scale(.98)}
.op-go button.rec{background:var(--cobalt);color:#fff}   /* 지금 기기에 맞는 쪽 */
.op-go button.rec:hover{background:var(--cobalt-d)}
.op-go button:focus-visible{outline-color:#fff}
.op-go svg{width:21px;height:21px}
@media (max-width:520px){
  .op-go{gap:10px;padding-left:20px;padding-right:20px}
  .op-go button{height:56px;font-size:15.5px;gap:7px}
  .op-go svg{width:18px;height:18px}
}

/* ================= 앱: 좁으면 키오스크 배치, 넓으면 테이블 태블릿 배치 ================= */
.app{container:app/inline-size;height:100%}
.shell{position:relative;height:100%;display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-rows:72px minmax(0,1fr) auto;grid-template-areas:"bar bar" "nav main" "dock dock";background:var(--paper);color:var(--ink);font-size:14px;line-height:20px}

/* --- 키오스크(모바일): 네이비 머리줄 · 왼쪽 글자 분류 줄 · 오른쪽 메뉴 · 아래 큰 버튼 --- */
.bar{grid-area:bar;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px 0 16px}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand b{font-size:20px;line-height:1;font-weight:800;letter-spacing:-.015em;white-space:nowrap}
.brand small{font-size:12px;line-height:1;font-weight:500;color:rgba(255,255,255,.7)}
.sp{flex:1}
/* 보기 바꾸기 버튼: PC 보기 ↔ 모바일 보기 */
.view{flex:none;display:inline-flex;align-items:center;height:40px;padding:0 13px;border-radius:6px;border:1px solid rgba(255,255,255,.4);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.view:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7)}
.view svg{width:17px;height:17px}
.view span{display:inline-flex;align-items:center;gap:6px}
body[data-mode="pc"] .view .to-pc,body[data-mode="mob"] .view .to-mob{display:none}
.only-wide{display:none!important}
.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:17px;height:17px}
.btn.prim{background:var(--cobalt);color:#fff}
.btn.prim:hover{background:var(--cobalt-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--control)}
.btn.ghost:hover{background:var(--mist);border-color:var(--slate)}

/* 왼쪽 분류 줄: 아이콘 없이 글자만. 지금 고른 분류는 코발트 블록으로 채워요 */
.nav{grid-area:nav;display:flex;flex-direction:column;overflow-y:auto;background:#fff;border-right:1px solid var(--line);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:flex;align-items:center;min-height:62px;padding:10px 8px 10px 16px;font-size:14px;line-height:18px;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-align:left;border-bottom:1px solid var(--line);transition:background .15s,color .15s}
.nav button:hover{background:var(--mist)}
.nav button[aria-current="true"]{background:var(--cobalt);color:#fff;font-weight:700;border-bottom-color:var(--cobalt)}
.nav button:focus-visible{outline-offset:-3px}
.nav .n{display:none}
.main{grid-area:main;min-height:0;overflow:auto;padding:16px 16px 28px}
.dock{grid-area:dock;display:grid;grid-template-columns:1fr 1.8fr;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.dock .btn{height:56px;border-radius:10px;font-size:16.5px}
.dock .btn svg{width:20px;height:20px}

/* 분류 제목: 굵은 선 아래에 매달린 큰 글자 */
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 16px;padding-top:12px;border-top:var(--rule) solid var(--ink)}
.title{font-size:23px;line-height:28px;font-weight:800;letter-spacing:-.03em}
.cnt{color:var(--slate);font-size:13.5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;animation:show .4s both;animation-delay:calc(var(--i,0)*35ms)}
.card.off{cursor:default}
@keyframes show{from{opacity:0}}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;color:#fff}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.thumb .bgi{display:none}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.6)}
/* 재생 표시: 영상 왼쪽 아래 모서리에 붙는 작은 네모 */
.thumb .pl{position:absolute;left:0;bottom:0;width:30px;height:30px;background:var(--ink);color:#fff;display:grid;place-items:center;transition:background .2s}
.thumb .pl svg{width:10px;height:10px;margin-left:1px}
@media (hover:hover){
  .card:not(.off):hover .thumb img{transform:scale(1.04)}
  .card:hover .pl,a.thumb:hover .pl{background:var(--cobalt)}
  .card:not(.off):hover h3{color:var(--cobalt)}
}
.bdg{position:absolute;left:0;top:0;padding:4px 9px;background:#fff;color:var(--ink);font-size:12px;line-height:16px;font-weight:700}
.info{display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.card h3{min-width:0;font-size:15px;line-height:21px;font-weight:700;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
/* 제목 아래 줄: 왼쪽에 지은이·연도, 오른쪽에 재생 시간(메뉴판의 가격 자리) */
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px}
.meta{display:flex;align-items:center;min-width:0;overflow:hidden;font-size:12.5px;line-height:1;color:var(--slate)}
.meta span{white-space:nowrap;line-height:13px}
.meta span+span{margin-left:8px;padding-left:8px;border-left:1px solid var(--control)}
.time{flex:none;font-size:13.5px;line-height:1;font-weight:700;color:var(--cobalt)}
.time.wait{font-weight:500;color:var(--slate)}
/* 세로 영상(9:16) 카드: 두 줄 높이를 차지해서 옆의 가로 영상 두 개와 키가 맞아요 */
.card.tall{grid-row:span 2}
.card.tall .thumb{flex:1 1 auto;aspect-ratio:9/16}

/* 분류마다 맨 위에 들어가는 배너(메인은 16:9). 영상을 넣기 전에는 제목 화면이 떠 있어요 */
.banner{position:relative;container-type:inline-size;margin:-16px -16px 20px;aspect-ratio:16/9;background:var(--ink);color:#fff;overflow:hidden}
.banner iframe{position:absolute;left:0;top:50%;width:100%;aspect-ratio:16/9;transform:translateY(-50%);border:0;pointer-events:none}
/* 제목 화면: 위에 굵은 흰 선과 작은 글자 한 줄, 아래에 왼쪽 맞춤 큰 글자 */
.tc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:6cqw 6cqw 5cqw}
.tc-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:max(8px,1.3cqw);border-top:max(2px,.4cqw) solid #fff;font-size:clamp(11.5px,1.5cqw,19px);line-height:1.2;font-weight:500;color:rgba(255,255,255,.78)}
.tc-top b{font-weight:700;color:#fff}
.tc-top i{font-style:normal;font-weight:600}
.tc-name{margin-left:-.05em;font-size:var(--fs,12cqw);line-height:.9;font-weight:800;letter-spacing:-.045em;white-space:nowrap}
.bigphoto{margin:-16px -16px 24px;aspect-ratio:4/5;background:var(--mist);color:var(--slate);display:grid;place-items:center;font-weight:500;overflow:hidden}
.bigphoto{position:relative;background:#EEF2FD}
.bigphoto img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.bigphoto .cap{display:none}

/* 소개 */
.profile .title{font-size:32px;line-height:34px;letter-spacing:-.035em}
.profile .role{color:var(--slate);font-size:15px;font-weight:500;margin-top:8px}
.profile p.intro{font-size:15.5px;line-height:27px;margin-top:18px;max-width:34em}
.profile h2{font-size:15px;line-height:20px;font-weight:800;letter-spacing:-.01em;margin-top:36px;padding-top:12px;border-top:var(--rule) solid var(--ink)}
.hist{width:100%;border-collapse:collapse;margin-top:6px}
.hist td{padding:12px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.hist td:first-child{width:96px;color:var(--slate)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tools span{height:32px;padding:0 13px;border-radius:6px;border:1px solid var(--control);display:inline-flex;align-items:center;font-size:14px;font-weight:600}
.yt{display:flex;align-items:center;gap:14px;margin-top:14px;padding:16px 18px;border:1px solid var(--control);border-radius:8px;transition:background .15s,border-color .15s}
.yt:hover{background:var(--mist);border-color:var(--slate)}
.yt svg{flex:none;width:28px;height:28px;color:var(--cobalt)}
.yt b{display:block;font-weight:700;font-size:15.5px;line-height:22px}
.yt span{font-size:13px;color:var(--slate)}

/* 영상 상세 (메뉴를 눌렀을 때 뜨는 창) */
.modal{grid-row:2;grid-column:1/-1;z-index:2;background:#fff;overflow:auto;padding:14px 16px 24px}
.dlg{animation:show .25s both}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.player{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--ink)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .thumb{height:100%;aspect-ratio:auto}
.player .thumb .ph{font-size:24px}
.player .thumb .pl{left:50%;top:50%;bottom:auto;width:64px;height:64px;margin:-32px 0 0 -32px}
.player .thumb .pl svg{width:20px;height:20px;margin-left:3px}
.player.tall{aspect-ratio:9/16;width:62%;margin:0 auto}   /* 세로 영상은 세로 화면으로 재생 */
.ytnote{margin-top:10px;font-size:13px;line-height:19px;color:var(--slate)}
.dr{margin-top:20px;padding-top:14px;border-top:var(--rule) solid var(--ink)}
.dr h2{font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.03em}
.dr .meta{flex-wrap:wrap;row-gap:8px;margin-top:10px;font-size:13.5px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:22px}
.tabs button{height:42px;color:var(--slate);font-weight:500;font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--cobalt)}
.pane{padding-top:18px;font-size:15px;line-height:26px;min-height:120px}
.steps{padding-left:20px}
.steps li{margin-bottom:14px}
.steps b{display:block;font-weight:700}
.ask{margin-top:20px;height:52px;width:100%;font-size:15.5px;border-radius:10px}

/* --- 테이블 태블릿(PC): 흰 머리줄 · 왼쪽 글자 메뉴 · 3열 사진 · 오른쪽 아래 버튼 --- */
@container app (min-width:900px){
  .shell{grid-template-columns:240px minmax(0,1fr);grid-template-rows:76px minmax(0,1fr) 80px;grid-template-areas:"bar bar" "nav main" "nav dock"}
  .only-wide{display:flex!important}
  .only-narrow{display:none!important}
  .bar{background:#fff;color:var(--ink);border-bottom:var(--rule) solid var(--ink);padding:0 32px 0 0;gap:0}
  .brand{width:240px;padding-left:28px}
  .brand b{font-size:22px;letter-spacing:-.02em}
  .brand small{display:none}
  .here{flex-direction:column;gap:3px;padding-left:32px}
  .here .hname{font-size:18px;line-height:24px;font-weight:700;letter-spacing:-.02em}
  .here span{font-size:13px;line-height:16px;color:var(--slate)}
  .view{margin-right:12px;height:44px;padding:0 16px;border-color:var(--control);color:var(--ink);font-size:14px}
  .view:hover{background:var(--mist);border-color:var(--slate)}
  .tbl{flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:76px;height:44px;border:1px solid var(--control);border-radius:6px}
  .tbl span{font-size:11.5px;line-height:13px;color:var(--slate)}
  .tbl b{font-size:17px;line-height:19px;font-weight:800}
  .nav{padding:0}
  .nav button{justify-content:space-between;min-height:0;height:58px;padding:0 24px 0 28px;font-size:17px;line-height:24px;font-weight:600}
  .nav button:hover{background:var(--mist)}
  .nav button[aria-current="true"]{background:var(--cobalt);color:#fff;font-weight:700}
  .nav .n{display:inline;font-size:13px;font-weight:600;color:var(--slate)}
  .nav button[aria-current="true"] .n{color:rgba(255,255,255,.8)}
  .nav .line{flex:none;height:20px}
  .nav .line~button{height:46px;border-bottom:0;font-size:15px;font-weight:500;color:var(--slate)}
  .nav .line~button:hover{background:none;color:var(--ink)}
  .main{padding:32px 32px 48px}
  .trow{display:none}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 24px}
  .card{gap:14px}
  .thumb .ph{font-size:19px}
  .thumb .pl{width:38px;height:38px}
  .thumb .pl svg{width:12px;height:12px}
  .card.tall .thumb{aspect-ratio:3/4}          /* 넓은 화면: 가로 카드 두 줄 높이에 맞추고 */
  .card.tall .thumb img{object-fit:contain}   /* 세로 썸네일은 자르지 않고 통째로 */
  .card.tall .thumb .bgi{display:block;inset:-30%;width:160%;height:160%;object-fit:cover;filter:blur(34px)}   /* 양옆 빈 곳은 같은 그림을 흐리게 */
  .player.tall{width:300px}
  .info{gap:6px}
  .card h3{font-size:17px;line-height:24px}
  .meta{font-size:14px}
  .meta span{line-height:14px}
  .time{font-size:15.5px}
  .banner{margin:-32px -32px 40px}
  .banner.strip{aspect-ratio:3/1}            /* 분류 배너는 낮게: 아래 영상이 바로 보이도록 */
  .banner.strip .tc{padding-top:3.4cqw;padding-bottom:3cqw}
  .bigphoto{margin:-32px -32px 36px;aspect-ratio:auto;height:440px}
  .bigphoto{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:100%;place-items:stretch;background:var(--ink)}
  .bigphoto img{min-height:0}
  .bigphoto img{grid-column:2;grid-row:1;object-position:center 22%}
  .bigphoto .cap{display:block;grid-column:1;grid-row:1;align-self:end;padding:0 56px 52px;color:#fff;text-align:left}
  .bigphoto .cap b{display:block;font-size:56px;line-height:56px;font-weight:800;letter-spacing:-.035em}
  .bigphoto .cap span{display:block;margin-top:12px;font-size:17px;color:#AFC0F5;font-weight:500}
  .bigphoto:has(.cap)+.profile>.title,.bigphoto:has(.cap)+.profile>.role{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}   /* PC는 사진 위 이름이 제목 역할 */
  .bigphoto:has(.cap)+.profile>.intro{margin-top:0}
  .profile{max-width:720px}
  .profile .title{font-size:52px;line-height:52px}

<script>
/* =====================================================================

// 1) 연락처 — 문의하기 버튼이 이 이메일과 전화번호로 연결돼요
const CONTACT={ name:'KIM SO YEON', role:'모션 디자이너', email:'ksy880426@gmail.com', phone:'010-3731-5235' };

const OPENING={ banner:'' };

// 2) 소개
const PROFILE={

  intro:'움직임으로 이야기를 전하는 모션 디자이너입니다. 광고, 북트레일러, 애니메이션을 기획부터 편집까지 만듭니다.',

//    banner를 비워 두면 그 자리에 제목 화면이 떠요. en: 제목 화면에 크게 들어가는 영어 이름
const CATS=[
  {id:'all',   name:'전체',        en:'',             icon:'grid', banner:''},
  {id:'intro', name:'소개',        en:'',             icon:'user', banner:''},
  {id:'ad',    name:'광고 제작물',  en:'Commercial',   icon:'ad',   banner:''},

];

// 4) 작품 — yt: 유튜브 영상 ID (youtube.com/watch?v=이부분). 넣으면 썸네일과 재생이 연결돼요
//    state: 'wip' 제작 중 / 'soon' 준비 중
const T=['#0A1238','#16225C','#101A4A','#1C2B70','#0D1640','#131E54'];   // 썸네일 없을 때 쓰는 임시 색
const WORKS=[
  ...[1,2,3,4,5,6].map(n=>({id:'ad'+n,cats:['ad'],title:'광고 '+n,en:'AD '+n,time:'0:15',year:2025,tools:'After Effects',yt:''})),
  // 북트레일러 — ratio:'9:16' 을 넣으면 세로 영상 카드(두 줄 높이)로 들어가요. by: 책 지은이
  {id:'bk1',cats:['book'],title:'바람이 분다, 가라',by:'한강',en:'BOOK 1',time:'3:34',tools:'Premiere Pro · After Effects',yt:'SOr_mlN4ipo'},
  {id:'bk2',cats:['book'],title:'아르테미스',by:'앤디 위어',en:'BOOK 2',time:'1:47',tools:'Premiere Pro · After Effects',ratio:'9:16',yt:'D7FgB9M5_n8'},
  {id:'bk3',cats:['book'],title:'모순',by:'양귀자',en:'BOOK 3',time:'1:55',tools:'Premiere Pro · After Effects',ratio:'9:16',yt:'hZVVFRppHfk'},
  {id:'bk4',cats:['book'],title:'프로젝트 헤일메리',by:'앤디 위어',en:'BOOK 4',time:'0:57',tools:'Premiere Pro · After Effects',yt:'tf5FNmodBmU'},
  {id:'knight',cats:['ani','team'],title:'흑기사',en:'BLACK KNIGHT',time:'3:20',year:2026,tools:'After Effects · Photoshop',team:'4인 팀',role:'연출 · 애니메이션',yt:'',
   story:'흑기사의 줄거리를 적어 주세요.',intent:'이 작품을 만든 이유를 적어 주세요.',
   process:[['레퍼런스','분위기와 비주얼 방향을 정하려고 참고 자료를 모았어요.'],['스토리보드','주요 장면과 시퀀스를 그림으로 짰어요.'],['애니메이션','연출에 맞춰 장면을 움직이고 완성했어요.']]},
  {id:'lint',cats:['ani'],title:'린트',en:'LINT',time:'',year:2026,tools:'Seedance · Premiere Pro',state:'wip',yt:'',
   story:'침대 밑 먼지 세계에 사는 여섯 친구의 이야기예요.'},
  {id:'chicken',cats:['ani'],title:'치킨',en:'CHICKEN',time:'',year:2026,state:'soon',yt:''},
  {id:'sangsang',cats:['team'],title:'상상 홈페이지',en:'SANGSANG',time:'',year:2026,tools:'Figma · HTML',team:'팀',role:'웹 디자인',yt:''},
  ...[1,2,3].map(n=>({id:'sc'+n,cats:['school'],title:'학원 실습 '+n,en:'CLASS '+n,time:'0:30',year:2025,tools:'After Effects',yt:''})),
];
WORKS.forEach((w,i)=>{w.bg=T[i%T.length]});

/* ===================================================================== */
const byId=id=>WORKS.find(w=>w.id===id), inCat=c=>c==='all'?WORKS:WORKS.filter(w=>w.cats.includes(c));
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const PLAY='<svg viewBox="0 0 12 12" fill="currentColor"><path d="M2 1l9 5-9 5z"/></svg>';
const ICON={
  mark:svg('<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>'),
  home:svg('<path d="M3 11l9-8 9 8M5 9v11h14V9"/>'),
  mail:svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
  back:svg('<path d="M15 5l-7 7 7 7"/>'),
  grid:svg('<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>'),
  ad:svg('<path d="M4 10v4h3l8 5V5l-8 5z"/><path d="M19 9a4 4 0 0 1 0 6"/>'),
  book:svg('<path d="M4 5a2 2 0 0 1 2-2h6v16H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-6v16h6a2 2 0 0 1 2 2z"/>'),
  film:svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>'),
  team:svg('<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14a5 5 0 0 1 5 5"/>'),
  cap:svg('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 3 9 3 12 0v-5"/>'),
  user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  phone:svg('<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'),
  pc:svg('<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
};
// 유튜브는 파일을 더블클릭해서 연 화면(file://)에서는 이 창 안 재생을 막아요. 그때는 유튜브에서 열리게 해요
const CAN_EMBED=location.protocol!=='file:';
const ytLink=w=>tall(w)?`https://www.youtube.com/shorts/${w.yt}`:`https://www.youtube.com/watch?v=${w.yt}`;
const ytFrame=(id,q,title)=>`<iframe src="https://www.youtube.com/embed/${id}?${q}" title="${title}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
const spans=a=>a.filter(Boolean).map(x=>`<span>${x}</span>`).join('');
const metaOf=w=>spans([w.by,w.year,w.team]);   // 제목 아래 왼쪽: 지은이 · 연도 · 팀
const timeOf=w=>w.state==='soon'?'<span class="time wait">준비 중</span>':w.time?`<span class="time num">${w.time}</span>`:'';   // 오른쪽: 재생 시간
const tall=w=>w.ratio==='9:16';   // 세로 영상(쇼츠)
const badge=w=>w.state==='wip'?'<span class="bdg">제작 중</span>':w.state==='soon'?'<span class="bdg">준비 중</span>':'';
function thumb(w,tag='div',attrs=''){
  const hq=`https://img.youtube.com/vi/${w.yt}/hqdefault.jpg`;
  // 세로 영상은 세로 썸네일(oar2)을 쓰고, 없으면(작은 대체 그림이 오면) 기본 썸네일로 바꿔요
  const img=!w.yt?`<span class="ph">${w.en}</span>`
    :tall(w)?[' class="bgi"',''].map(c=>`<img${c} src="https://i.ytimg.com/vi/${w.yt}/oar2.jpg" onload="if(this.naturalWidth<=120){this.onload=null;this.src='${hq}'}" onerror="this.onerror=null;this.src='${hq}'" alt="">`).join('')   // bgi: 세로 영상 양옆을 채우는 흐린 배경
    :`<img src="${hq}" alt="">`;
  return `<${tag} class="thumb" ${attrs} style="background:${w.bg}">${img}${badge(w)}${w.yt?`<span class="pl">${PLAY}</span>`:''}</${tag}>`;
}

/* 문의 창 */
function openContact(about){
  dlgAbout.textContent=about?`「${about}」에 대해 문의해요.`:'영상 제작 문의를 받아요.';
  dlgMail.href='mailto:'+CONTACT.email+'?subject='+encodeURIComponent('[영상 문의] '+(about||'포트폴리오를 보고 연락드립니다'));

}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* 앱 만들기 */
function buildApp(root,opt){
  const st={cat:opt.cat||'all',cur:null,tab:'story',seen:[]};
  let wide=false, H='div';   // 화면 제목(h1)은 지금 보이는 배치에 하나만 둬요

  root.innerHTML=`<div class="shell">
    <header class="bar"><span class="brand"><b>${CONTACT.name}</b><small>영상 포트폴리오</small></span>
      <span class="here only-wide"></span><span class="sp"></span>

      <button class="btn prim" data-act="contact">${ICON.mail}연락 문의하기</button></div>
    <div class="modal" hidden></div></div>`;
  const $=s=>root.querySelector(s);

  function nav(){
    $('.nav').innerHTML=CATS.map(c=>`<button data-act="cat" data-id="${c.id}" aria-current="${c.id===st.cat}"><span>${c.name}</span>${c.id==='intro'?'':`<span class="n num" aria-hidden="true">${inCat(c.id).length}</span>`}</button>`).join('')
      +`<span class="line only-wide"></span><button class="only-wide" data-act="contact">연락 문의</button><button class="only-wide" data-act="home">처음으로</button>`;
    const c=CATS.find(x=>x.id===st.cat);
    const HH=opt.live&&wide&&c.id!=='intro'?'h1':'div';
    $('.here').innerHTML=`<${HH} class="hname">${c.name}</${HH}><span>${c.id==='intro'?CONTACT.role:'영상 '+inCat(c.id).length+'편'}</span>`;
  }
  function banner(c){
    const label=c.id==='all'?'소개 영상':c.name+' 배너 영상';
    // 배너 영상이 아직 없으면 제목 화면: 왼쪽 위 분류 이름, 오른쪽 위 영상 수, 아래에 큰 이름
    return `<div class="banner ${c.id==='all'?'':'strip'}">${c.banner&&CAN_EMBED?ytFrame(c.banner,`autoplay=1&mute=1&loop=1&playlist=${c.banner}&controls=0&rel=0&playsinline=1`,label)
      :`<div class="tc"><div class="tc-top"><b>${c.id==='all'?CONTACT.role:c.name}</b>${c.id==='all'?'<span>영상 포트폴리오</span>':`<i>${CONTACT.name}</i>`}</div>
        <div class="tc-name" ${c.id==='all'?'style="--fs:14.6cqw"':''}>${c.id==='all'?CONTACT.name:c.en||c.name}</div></div>`}</div>`;
  }
  function list(){
    const c=CATS.find(x=>x.id===st.cat), ws=inCat(st.cat);
    return `${banner(c)}<div class="trow"><${H} class="title">${c.name}</${H}><span class="cnt num">${ws.length}편</span></div>
      <div class="grid">${ws.map((w,i)=>{const off=w.state==='soon';return `<article class="card ${off?'off':''} ${tall(w)?'tall':''}" style="--i:${Math.min(i,11)}" ${off?'':`data-act="open" data-id="${w.id}" tabindex="0" role="button" aria-label="${w.title} 보기"`}>
        ${thumb(w)}
        <div class="info"><h3>${w.title}</h3><div class="sub"><p class="meta num">${metaOf(w)}</p>${timeOf(w)}</div></div></article>`}).join('')}</div>`;
  }
  function intro(){
    const y=PROFILE.youtube;
    return `<div class="bigphoto">${PROFILE.photo?`<img src="${PROFILE.photo}" alt="${CONTACT.name} 프로필 사진"><div class="cap" aria-hidden="true"><b>${CONTACT.name}</b><span>${CONTACT.role}</span></div>`:'프로필 사진이 들어갈 자리'}</div>
      <div class="profile"><${opt.live?'h1':'div'} class="title">${CONTACT.name}</${opt.live?'h1':'div'}><p class="role">${CONTACT.role}</p>

        <h2>유튜브 채널</h2><a class="yt" ${y.url?`href="${y.url}" target="_blank" rel="noopener"`:''}>${ICON.mark}<div><b>${y.name}</b><span>${y.url||'채널 주소를 넣으면 연결돼요'}</span></div></a>
        <h2>사용 툴</h2><div class="tools">${PROFILE.tools.map(t=>`<span>${t}</span>`).join('')}</div></div>`;
  }
  function pane(){
    const w=st.cur;
    root.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===st.tab));
    $('.pane').innerHTML=st.tab==='process'
      ?(w.process?`<ol class="steps">${w.process.map(s=>`<li><b>${s[0]}</b>${s[1]}</li>`).join('')}</ol>`:'제작 과정을 정리하고 있어요.')
      :(w[st.tab]||(st.tab==='story'?'영상 내용을 정리하고 있어요.':'기획 의도를 정리하고 있어요.'));
  }
  function openWork(w){
    st.cur=w; st.tab='story'; st.seen=[w.id,...st.seen.filter(x=>x!==w.id)];
    $('.seen b').textContent=st.seen.length;
    const m=$('.modal'); m.hidden=false;
    m.innerHTML=`<div class="dlg" role="dialog" aria-label="${w.title}">
      <div class="dtop"><button class="btn ghost" data-act="back">${ICON.back}목록으로</button></div>
      <div class="pv"><div class="player ${tall(w)?'tall':''}">${!w.yt?thumb(w)
        :CAN_EMBED?ytFrame(w.yt,'autoplay=1&rel=0&playsinline=1',w.title)
        :thumb(w,'a',`href="${ytLink(w)}" target="_blank" rel="noopener" aria-label="${w.title} 유튜브에서 보기"`)}</div>
        ${w.yt&&!CAN_EMBED?'<p class="ytnote">파일을 바로 연 화면에서는 유튜브가 이 창 안에서 재생되지 않아요. 영상을 누르면 유튜브에서 열려요. 인터넷에 올린 주소에서는 이 자리에서 바로 재생돼요.</p>':''}</div>
      <div class="dr"><h2>${w.title}</h2><p class="meta num">${spans([w.by,w.year,w.time,w.team,w.role&&'내 역할 '+w.role,w.tools])}</p>
        <div class="tabs" role="tablist">${[['story','영상 내용'],['intent','기획 의도'],['process','제작 과정']].map(t=>`<button role="tab" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>
        <div class="pane"></div>
        <button class="btn prim ask" data-act="contact" data-about="${w.title}">${ICON.mail}이 영상으로 문의하기</button></div></div>`;
    pane();
  }
  function closeWork(){st.cur=null;const m=$('.modal');m.hidden=true;m.innerHTML=''}
  function render(){
    pick(); nav();
    $('.main').innerHTML=st.cat==='intro'?intro():list();
    $('.main').scrollTop=0;
  }
  root.addEventListener('click',e=>{
    if(e.target.classList.contains('modal')){closeWork();return}
    const b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
    const a=b.dataset.act, id=b.dataset.id;
    if(a==='cat'){closeWork();st.cat=id;render()}
    else if(a==='open'){openWork(byId(id))}
    else if(a==='back'){closeWork()}
    else if(a==='tab'){st.tab=id;pane()}
    else if(a==='contact'){openContact(b.dataset.about||'')}
    else if(a==='home'){closeWork();st.cat='all';render();showOpening()}   // 처음으로 = 오프닝 화면
    else if(a==='view'){setMode(document.body.dataset.mode==='pc'?'mob':'pc')}
  });
  if(opt.live)new ResizeObserver(()=>{const was=wide;pick();if(was!==wide)render()}).observe(root);
  if(opt.live)addEventListener('keydown',e=>{if(e.key==='Escape'&&st.cur&&!dlg.open)closeWork()});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card[data-act]')){e.preventDefault();e.target.click()}});   // 키보드로도 영상 열기
  render();
}

/* 보기 방식: 'pc' 또는 'mob'
   - PC 보기: 화면 가득. 화면 폭이 900px보다 좁으면(휴대폰) 1200px 폭 PC 화면을 통째로 줄여서 보여줘요
   - 모바일 보기: 휴대폰 폭 그대로 */
const PC_W=1200, appEl=document.getElementById('app');
function fit(){
  const s=document.body.dataset.mode==='pc'&&innerWidth<900?innerWidth/PC_W:1;
  appEl.style.setProperty('--s',s);
  document.body.toggleAttribute('data-small',s<1);
}
function setMode(m){document.body.dataset.mode=m;fit()}
addEventListener('resize',fit);
const Q=new URLSearchParams(location.search);   // 주소 뒤에 ?mode=pc 또는 ?mode=mob 을 붙이면 오프닝 없이 그 화면으로 바로 열려요
const isPhone=Math.min(screen.width,screen.height)<700||innerWidth<700;
const stageEl=document.getElementById('stage');

/* 오프닝 화면 */
(function(){
  const b=OPENING.banner, box=document.getElementById('opBanner');
  box.innerHTML=!b?`<div class="tc"><div class="tc-top"><b>${CONTACT.role}</b><span>영상 포트폴리오</span></div><div class="tc-name" style="--fs:14.6cqw">${CONTACT.name}</div></div>`
    :/\.(jpe?g|png|webp|gif|avif|svg)$/i.test(b)?`<img src="${b}" alt="${CONTACT.name} 영상 포트폴리오">`
    :/\.(mp4|webm|mov)$/i.test(b)?`<video src="${b}" autoplay muted loop playsinline></video>`
    :CAN_EMBED?ytFrame(b,`autoplay=1&mute=1&loop=1&playlist=${b}&controls=0&rel=0&playsinline=1`,'오프닝 영상'):'';
  document.getElementById(isPhone?'goMob':'goPc').classList.add('rec');   // 지금 기기에 맞는 쪽을 파랗게
})();
function showOpening(){document.body.setAttribute('data-open','');stageEl.inert=true}
function enter(m){setMode(m);document.body.removeAttribute('data-open');stageEl.inert=false}

setMode(isPhone?'mob':'pc');
buildApp(appEl,{live:true,cat:CATS.some(c=>c.id===Q.get('cat'))?Q.get('cat'):'all'});
if(['mob','pc'].includes(Q.get('mode')))enter(Q.get('mode')); else showOpening();
</script>
</body>
</html>
